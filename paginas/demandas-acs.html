<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demandas · Kanban BRB</title>

<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F5F5;
    --bg-panel: #FFFFFF;
    --ink: #1E212C;
    --ink-dim: #4B5A68;
    --ink-faint: #7C8894;
    --line: #E5E6E7;
    --line-soft: #EFEFEF;
    --accent: #FF6C0C;
    --accent-soft: #FFE8D9;
    --warn: #B83A22;
    --warn-soft: #FBE3DD;
    --ok: #0B9C7F;
    --ok-soft: #D8F1EB;
    --info: #3C6FD8;
    --info-soft: #E2EAFB;
    --shadow: 0 1px 2px rgba(30,33,44,0.06), 0 1px 1px rgba(30,33,44,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E212C;
      --bg-panel: #262B38;
      --ink: #F5F5F5;
      --ink-dim: #A7B0BC;
      --ink-faint: #78838F;
      --line: #333846;
      --line-soft: #2A2E3A;
      --accent: #FF8A3D;
      --accent-soft: #3A2A1C;
      --warn: #F08A72;
      --warn-soft: #3F2320;
      --ok: #3EE8C4;
      --ok-soft: #173A33;
      --info: #8FB0F5;
      --info-soft: #222D45;
      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Lato, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  header.top { background: var(--bg); border-bottom: 1px solid var(--line); padding: 22px 28px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; }
  .titles h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  .titles p { margin: 3px 0 0; font-size: 0.8rem; color: var(--ink-faint); }

  main { max-width: 1400px; margin: 0 auto; padding: 22px 28px 60px; }
  .painel { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 16px 18px 18px; box-shadow: var(--shadow); }

  /* Barra de filtros e botões: o mesmo padrão da tela de Expedições (rótulo +
     select, com a contagem dentro da opção; botões empurrados para a direita). */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--ink-dim); text-decoration: none;
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; background: var(--bg-panel);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn .ico { width: 14px; height: 14px; flex-shrink: 0; }
  .btn.destaque { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .barra label { font-size: 0.78rem; font-weight: 700; color: var(--ink-dim); }
  /* rótulo + campo andam juntos: quando a barra quebra de linha, quebra entre os pares */
  .barra .par { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .barra select, .barra input {
    font: inherit; font-size: 0.85rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
  }
  .barra select { min-width: 200px; }
  .barra input { min-width: 240px; }
  .barra .empurra { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  select:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  /* Hora dos dados, como a linha de situação das Expedições. */
  .quando { margin: 0 0 14px; font-size: 0.74rem; color: var(--ink-faint); }
  .quando b { color: var(--ink-dim); font-weight: 700; }

  .aviso { margin-bottom: 12px; padding: 10px 13px; border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 6px 6px 0; font-size: 0.82rem; line-height: 1.5; }
  .aviso b { font-weight: 700; }
  .aviso.info { border-left-color: var(--info); background: var(--info-soft); }
  .aviso.leve { background: var(--line-soft); }
  .aviso .detalhe { display: block; margin-top: 3px; color: var(--ink-dim); overflow-wrap: anywhere; }

  .tabela-scroll { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
  table.grade { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 0.82rem; }
  /* A linha inteira abre o detalhe da demanda. */
  table.grade tbody tr { cursor: pointer; }
  table.grade tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* Paginação: aparece quando a lista passa de 10. */
  .paginacao { display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; margin-top: 12px; font-size: 0.78rem; color: var(--ink-dim); }
  .paginacao .lado { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .paginacao label { font-weight: 700; }
  .paginacao select { font: inherit; font-size: 0.8rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .paginacao .pag-atual { font-variant-numeric: tabular-nums; padding: 0 4px; }

  /* Detalhe da demanda: mesma cara das caixas de diálogo do sistema (dialogo.js). */
  dialog.detalhe {
    border: 1px solid var(--line); border-radius: 16px; padding: 0; margin: auto; width: min(640px, calc(100vw - 32px));
    background: var(--bg-panel); color: var(--ink); font-family: inherit; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.2); animation: det-entra .16s ease-out;
  }
  dialog.detalhe::backdrop { background: rgba(15,17,24,.58); backdrop-filter: blur(3px); }
  .det-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 16px; border-bottom: 1px solid var(--line-soft); }
  .det-rotulo { display: block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }
  .det-topo h2 { margin: 3px 0 8px; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .det-fechar { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.4rem; line-height: 1; color: var(--ink-faint); }
  .det-fechar:hover { background: var(--line-soft); color: var(--ink); }
  .det-corpo { padding: 18px 24px 6px; max-height: min(62vh, 560px); overflow: auto; }
  .det-resumo { margin: 0 0 18px; padding: 12px 14px; border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; background: var(--line-soft); font-size: 0.95rem; line-height: 1.5; overflow-wrap: anywhere; }
  .det-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; margin: 0 0 14px; }
  .det-grade div { min-width: 0; }
  .det-grade dt { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); margin-bottom: 4px; }
  .det-grade dd { margin: 0; font-size: 0.92rem; line-height: 1.4; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .det-grade .larga { grid-column: 1 / -1; }
  .det-grade .det-resumo { margin: 0; }
  .det-secao { margin: 6px 0 12px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim); }
  .det-rodape { display: flex; justify-content: flex-end; padding: 14px 24px 20px; }
  @keyframes det-entra { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { dialog.detalhe { animation: none; } }
  @media (max-width: 520px) { .det-grade { grid-template-columns: 1fr; } }
  table.grade th {
    text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint);
    font-weight: 700; padding: 0; border-bottom: 2px solid var(--accent); white-space: nowrap; background: var(--bg-panel);
  }
  table.grade th button { width: 100%; border: 0; background: none; padding: 9px 10px; text-align: left; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; }
  table.grade th button:hover { color: var(--accent); }
  table.grade th[aria-sort] button { color: var(--ink); }
  table.grade th[aria-sort="ascending"] button::after { content: ' ▲'; color: var(--accent); }
  table.grade th[aria-sort="descending"] button::after { content: ' ▼'; color: var(--accent); }
  table.grade td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  table.grade tbody tr:hover td { background: var(--line-soft); }
  table.grade tbody tr:last-child td { border-bottom: 0; }
  td.numero { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.data, td.tempo { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-dim); }
  td.resumo { min-width: 300px; line-height: 1.4; }
  td.gestor { color: var(--ink-dim); min-width: 150px; }
  .vazio-data { color: var(--ink-faint); }

  .status { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 3px 9px; border-radius: 4px; background: var(--line-soft); color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
  .status.exec { background: var(--info-soft); color: var(--info); }
  .status.parada { background: var(--warn-soft); color: var(--warn); }
  .status.homologacao { background: var(--accent-soft); color: var(--accent); }
  .status.feita { background: var(--ok-soft); color: var(--ok); }

  .vazio { padding: 26px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; color: var(--ink-dim); font-size: 0.88rem; line-height: 1.55; }
  .rodape-nota { margin: 12px 2px 0; font-size: 0.74rem; color: var(--ink-faint); line-height: 1.5; }
  .rodape-nota a { color: var(--ink-dim); }

  @media (max-width: 760px) {
    main { padding: 16px; }
    header.top { padding: 16px; }
    .barra select, .barra input { min-width: 0; flex: 1 1 160px; }
    .barra .par { flex: 1 1 100%; }
    .barra .empurra { margin-left: 0; }
  }
</style>

<header class="top">
  <div class="top-row">
    <div class="titles">
      <h1>Demandas</h1>
      <p>Solicitações em andamento no ACS do BRB · sistema TTB</p>
    </div>
    <nav data-menu="demandas"></nav>
  </div>
</header>

<main>
  <div class="painel">
    <div class="barra" id="barra">
      <span class="par"><label for="selStatus">Status</label><select id="selStatus"><option value="">Todas</option></select></span>
      <span class="par"><label for="selGestor">Gestor de negócio</label><select id="selGestor"><option value="">Todos</option></select></span>
      <span class="par"><label for="busca">Busca</label><input id="busca" type="search" maxlength="80" placeholder="Número ou resumo"></span>
      <span class="empurra">
        <button type="button" class="btn destaque" id="btnAtualizar" disabled title="Pede ao coletor uma nova leitura do ACS">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Atualizar
        </button>
      </span>
    </div>
    <p class="quando" id="quando" aria-live="polite">Carregando…</p>
    <div id="avisos" aria-live="polite"></div>
    <div id="lista"></div>
    <div class="paginacao" id="paginacao" hidden></div>
    <p class="rodape-nota" id="rodape" hidden></p>
  </div>
</main>

<dialog class="detalhe" id="detalhe" aria-labelledby="detTitulo">
  <div class="det-topo">
    <div>
      <span class="det-rotulo">Demanda no ACS</span>
      <h2 id="detTitulo"></h2>
      <span id="detStatus"></span>
    </div>
    <button type="button" class="det-fechar" data-fechar aria-label="Fechar">×</button>
  </div>
  <div class="det-corpo" id="detCorpo"></div>
  <div class="det-rodape"><button type="button" class="btn" data-fechar>Fechar</button></div>
</dialog>

<script src="/menu.js"></script>
<script>
  (function () {
    var elQuando = document.getElementById('quando');
    var elAvisos = document.getElementById('avisos');
    var selStatus = document.getElementById('selStatus');
    var selGestor = document.getElementById('selGestor');
    var elBusca = document.getElementById('busca');
    var elLista = document.getElementById('lista');
    var elRodape = document.getElementById('rodape');
    var btnAtualizar = document.getElementById('btnAtualizar');

    // Ordem do fluxo da solicitação no ACS. Status que não está aqui (o ACS
    // pode criar outro) aparece no fim, com a cor neutra.
    var STATUS = [
      { codigo: 'S', classe: '' },            // Solicitada
      { codigo: 'A', classe: '' },            // Liberada para atendimento
      { codigo: 'X', classe: 'exec' },        // Em execução
      { codigo: 'D', classe: 'parada' },      // Pendente
      { codigo: 'P', classe: 'parada' },      // Suspensa
      { codigo: 'H', classe: 'homologacao' }, // Aguardando homologação
      { codigo: 'G', classe: 'feita' },       // Homologada
      { codigo: 'Q', classe: 'feita' }        // Em implantação
    ];
    function ordemStatus(codigo) {
      for (var i = 0; i < STATUS.length; i++) if (STATUS[i].codigo === codigo) return i;
      return STATUS.length;
    }
    function classeStatus(codigo) {
      var i = ordemStatus(codigo);
      return i < STATUS.length ? STATUS[i].classe : '';
    }

    var COLUNAS = [
      { id: 'numero', rotulo: 'Nº ACS' },
      { id: 'status', rotulo: 'Status' },
      { id: 'resumo', rotulo: 'Resumo' },
      { id: 'gestor', rotulo: 'Gestor de negócio' },
      { id: 'dataSolicitacao', rotulo: 'Solicitada em' }
    ];
    // O resto (previsões, implantação, tempo no status) aparece no detalhe,
    // que abre ao clicar na linha.
    var STATUS_INICIAL = 'X'; // Em execução
    var POR_PAGINA = [10, 20, 30];
    var elPaginacao = document.getElementById('paginacao');
    var elDetalhe = document.getElementById('detalhe');
    function porPaginaGuardado() {
      try { var n = Number(localStorage.getItem('demandas.porPagina')); return POR_PAGINA.indexOf(n) >= 0 ? n : POR_PAGINA[0]; }
      catch (e) { return POR_PAGINA[0]; }
    }

    var estado = {
      hoje: null, solicitacoes: [], coleta: null,
      filtroStatus: '',            // código do status; vazio = todas
      filtroGestor: '',            // nome do gestor; vazio = todos
      termo: '',
      ordem: { coluna: 'status', sentido: 1 },
      pagina: 1,
      porPagina: porPaginaGuardado(),
      pedindo: false
    };
    var acompanhamento = null;      // intervalo que espera o coletor atender o pedido
    var ACOMPANHAR_A_CADA_MS = 20000;
    var ACOMPANHAR_NO_MAXIMO = 45;  // 45 x 20s = 15 minutos

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function dataDia(iso) { // AAAA-MM-DD, sem fuso
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
      return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
    }
    function diaBrasilia(instante) { // instante -> AAAA-MM-DD em Brasília
      var d = new Date(instante);
      if (isNaN(d)) return '';
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    }
    function dataHora(instante) {
      var d = new Date(instante);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit' }) + ' às ' +
        d.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
    }
    function diasEntre(deIso, ateIso) {
      var a = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(deIso || ''));
      var b = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ateIso || ''));
      if (!a || !b) return null;
      return Math.round((Date.UTC(+b[1], +b[2] - 1, +b[3]) - Date.UTC(+a[1], +a[2] - 1, +a[3])) / 86400000);
    }
    function semAcento(s) {
      return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    // ---- coleta: quando atualizou, avisos ----

    function renderColeta() {
      var c = estado.coleta;
      var avisos = '';
      if (!c) { elQuando.textContent = ''; elAvisos.innerHTML = ''; return; }

      if (c.estado === 'nunca') {
        elQuando.innerHTML = 'Ainda sem dados do ACS';
        avisos += '<div class="aviso"><b>Nenhuma coleta foi feita até agora.</b> O coletor (na máquina dentro da rede do BRB) ainda não mandou a lista de demandas.</div>';
      } else {
        elQuando.innerHTML = 'Atualizado em <b>' + esc(dataHora(c.ultimaOk)) + '</b> · ' +
          estado.solicitacoes.length + (estado.solicitacoes.length === 1 ? ' demanda em andamento' : ' demandas em andamento');
        if (c.estado === 'atrasada') {
          avisos += '<div class="aviso"><b>Sem atualização há mais de 1 dia útil.</b> A última coleta que deu certo foi em ' +
            esc(dataHora(c.ultimaOk)) + '. A lista abaixo pode estar desatualizada: vale conferir se a máquina do coletor está ligada e na rede do BRB.</div>';
        }
      }
      if (c.ultimaFalha) {
        avisos += '<div class="aviso' + (c.estado === 'em-dia' ? ' leve' : '') + '"><b>A última tentativa de atualização falhou</b> (' + esc(dataHora(c.ultimaFalha.quando)) + ').' +
          (c.ultimaFalha.erro ? '<span class="detalhe">Motivo: ' + esc(c.ultimaFalha.erro) + '</span>' : '') + '</div>';
      }
      if (c.pedido) {
        avisos += '<div class="aviso info"><b>Atualização pedida</b> por ' + esc(c.pedido.pedidoPor) + ' em ' + esc(dataHora(c.pedido.pedidoEm)) +
          '. O coletor atende em até 5 minutos, se a máquina dele estiver ligada e na rede do BRB. Esta tela se atualiza sozinha.</div>';
      }
      elAvisos.innerHTML = avisos;
      btnAtualizar.disabled = estado.pedindo || !!c.pedido;
    }

    // ---- filtros e tabela ----

    function doGestor(s) { return !estado.filtroGestor || s.gestor === estado.filtroGestor; }
    function daBusca(s) {
      var termo = semAcento(estado.termo.trim());
      return !termo || semAcento(s.numero + ' ' + s.resumo).indexOf(termo) >= 0;
    }
    function primeiraMaiuscula(t) { return t.charAt(0) + t.slice(1).toLowerCase(); }

    /* Os dois selects, como em Expedições: a contagem fica na própria opção
     * ("Em execução (17)") e respeita o gestor escolhido e a busca. */
    function renderFiltros() {
      var base = estado.solicitacoes.filter(function (s) { return doGestor(s) && daBusca(s); });
      var mapa = {};
      estado.solicitacoes.forEach(function (s) {
        if (!mapa[s.statusCodigo]) mapa[s.statusCodigo] = { codigo: s.statusCodigo, nome: s.status, n: 0 };
      });
      base.forEach(function (s) { mapa[s.statusCodigo].n++; });
      var grupos = Object.keys(mapa).map(function (k) { return mapa[k]; })
        .sort(function (a, b) { return ordemStatus(a.codigo) - ordemStatus(b.codigo) || a.nome.localeCompare(b.nome); });
      // status escolhido que sumiu da lista (a demanda mudou de status): volta para "Todas"
      if (estado.filtroStatus && !mapa[estado.filtroStatus]) estado.filtroStatus = '';
      selStatus.innerHTML = '<option value="">Todas (' + base.length + ')</option>' + grupos.map(function (g) {
        return '<option value="' + esc(g.codigo) + '"' + (g.codigo === estado.filtroStatus ? ' selected' : '') + '>' +
          esc(primeiraMaiuscula(g.nome)) + ' (' + g.n + ')</option>';
      }).join('');

      var nomes = {};
      estado.solicitacoes.forEach(function (s) { if (s.gestor) nomes[s.gestor] = true; });
      if (estado.filtroGestor && !nomes[estado.filtroGestor]) estado.filtroGestor = '';
      selGestor.innerHTML = '<option value="">Todos</option>' + Object.keys(nomes).sort(function (a, b) { return a.localeCompare(b); }).map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === estado.filtroGestor ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('');

      var vazio = !estado.solicitacoes.length;
      selStatus.disabled = vazio; selGestor.disabled = vazio; elBusca.disabled = vazio;
    }

    function visiveis() {
      var lista = estado.solicitacoes.filter(function (s) {
        if (estado.filtroStatus && s.statusCodigo !== estado.filtroStatus) return false;
        return doGestor(s) && daBusca(s);
      });
      var col = estado.ordem.coluna;
      var sentido = estado.ordem.sentido;
      function chave(s) {
        if (col === 'status') return ordemStatus(s.statusCodigo);
        if (col === 'numero') return s.numero;
        if (col === 'resumo' || col === 'gestor') return semAcento(s[col]);
        return s[col] || ''; // datas AAAA-MM-DD e instante ISO ordenam como texto
      }
      return lista.sort(function (a, b) {
        var ka = chave(a), kb = chave(b);
        // sem data vai sempre para o fim, em qualquer sentido
        if (ka === '' && kb !== '') return 1;
        if (kb === '' && ka !== '') return -1;
        if (ka < kb) return -sentido;
        if (ka > kb) return sentido;
        // empate: término previsto mais próximo primeiro, depois o número
        var ta = a.previsaoTermino || '9999', tb = b.previsaoTermino || '9999';
        if (ta !== tb) return ta < tb ? -1 : 1;
        return a.numero - b.numero;
      });
    }

    function tempoNoStatus(s) {
      var dias = diasEntre(diaBrasilia(s.statusDesde), estado.hoje);
      if (dias === null) return '<span class="vazio-data">—</span>';
      var texto = dias <= 0 ? 'desde hoje' : (dias === 1 ? 'há 1 dia' : 'há ' + dias + ' dias');
      if (s.statusDesdeAproximado) {
        // O ACS não diz quando o status mudou: só sabemos desde quando passamos a acompanhar.
        texto = dias <= 0 ? 'pelo menos desde hoje' : (dias === 1 ? 'há 1 dia ou mais' : 'há ' + dias + ' dias ou mais');
        return '<span title="O ACS não informa quando o status mudou. A contagem começa no dia em que esta tela passou a acompanhar a demanda.">' + texto + '</span>';
      }
      return texto;
    }

    function celulaData(iso) {
      var d = dataDia(iso);
      return '<td class="data">' + (d || '<span class="vazio-data">—</span>') + '</td>';
    }

    /* Rodapé da lista: só aparece quando há mais de 10 demandas no filtro. */
    function renderPaginacao(total, paginas, inicio, fim) {
      if (total <= POR_PAGINA[0]) { elPaginacao.hidden = true; elPaginacao.innerHTML = ''; return; }
      elPaginacao.hidden = false;
      elPaginacao.innerHTML =
        '<span class="lado"><span>Mostrando <b>' + (inicio + 1) + '–' + fim + '</b> de <b>' + total + '</b></span>' +
          '<label for="selPorPagina">Por página</label><select id="selPorPagina">' + POR_PAGINA.map(function (n) {
            return '<option value="' + n + '"' + (n === estado.porPagina ? ' selected' : '') + '>' + n + '</option>';
          }).join('') + '</select></span>' +
        '<span class="lado">' +
          '<button type="button" class="btn" data-pagina="' + (estado.pagina - 1) + '"' + (estado.pagina <= 1 ? ' disabled' : '') + '>‹ Anterior</button>' +
          '<span class="pag-atual">Página ' + estado.pagina + ' de ' + paginas + '</span>' +
          '<button type="button" class="btn" data-pagina="' + (estado.pagina + 1) + '"' + (estado.pagina >= paginas ? ' disabled' : '') + '>Próxima ›</button></span>';
    }

    function renderLista() {
      renderFiltros();
      if (!estado.solicitacoes.length) {
        renderPaginacao(0);
        elLista.innerHTML = estado.coleta && estado.coleta.estado === 'nunca' ? ''
          : '<div class="vazio">Nenhuma demanda em andamento no ACS.</div>';
        return;
      }
      var todas = visiveis();
      if (!todas.length) {
        renderPaginacao(0);
        elLista.innerHTML = '<div class="vazio">Nenhuma demanda bate com o filtro.</div>';
        return;
      }
      var paginas = Math.ceil(todas.length / estado.porPagina);
      if (estado.pagina > paginas) estado.pagina = paginas;
      if (estado.pagina < 1) estado.pagina = 1;
      var inicio = (estado.pagina - 1) * estado.porPagina;
      var lista = todas.slice(inicio, inicio + estado.porPagina);
      renderPaginacao(todas.length, paginas, inicio, inicio + lista.length);
      var h = '<div class="tabela-scroll"><table class="grade"><thead><tr>';
      COLUNAS.forEach(function (c) {
        var marcada = estado.ordem.coluna === c.id;
        h += '<th' + (marcada ? ' aria-sort="' + (estado.ordem.sentido > 0 ? 'ascending' : 'descending') + '"' : '') + '>' +
          '<button type="button" data-ordem="' + c.id + '" title="Ordenar por ' + esc(c.rotulo.toLowerCase()) + '">' + esc(c.rotulo) + '</button></th>';
      });
      h += '</tr></thead><tbody>';
      lista.forEach(function (s) {
        h += '<tr tabindex="0" data-numero="' + esc(s.numero) + '" title="Ver todos os dados da demanda ' + esc(s.numero) + '">' +
          '<td class="numero">' + esc(s.numero) + '</td>' +
          '<td><span class="status ' + classeStatus(s.statusCodigo) + '">' + esc(s.status) + '</span></td>' +
          '<td class="resumo">' + esc(s.resumo) + '</td>' +
          '<td class="gestor">' + esc(s.gestor) + '</td>' +
          celulaData(s.dataSolicitacao) + '</tr>';
      });
      h += '</tbody></table></div>';
      elLista.innerHTML = h;
    }

    function render() { renderColeta(); renderLista(); }

    // ---- detalhe da demanda (abre ao clicar na linha) ----

    function campo(rotulo, valorHtml, larga) {
      return '<div' + (larga ? ' class="larga"' : '') + '><dt>' + rotulo + '</dt><dd>' + (valorHtml || '<span class="vazio-data">Não informado</span>') + '</dd></div>';
    }
    function dataOuVazio(iso, vazio) {
      var d = dataDia(iso);
      return d || '<span class="vazio-data">' + vazio + '</span>';
    }

    function abrirDetalhe(numero) {
      var s = null;
      estado.solicitacoes.forEach(function (x) { if (String(x.numero) === String(numero)) s = x; });
      if (!s) return;
      document.getElementById('detTitulo').textContent = s.numero;
      document.getElementById('detStatus').innerHTML = ''; // o status aparece como campo, logo abaixo
      // Todos os campos que o ACS manda, cada um com o seu rótulo - inclusive
      // os que já aparecem na lista. (A matrícula do gestor não é guardada.)
      document.getElementById('detCorpo').innerHTML =
        '<dl class="det-grade">' +
          campo('Nº ACS', esc(s.numero)) +
          campo('Status', '<span class="status ' + classeStatus(s.statusCodigo) + '">' + esc(s.status) + '</span>') +
          campo('Resumo', s.resumo ? '<div class="det-resumo">' + esc(s.resumo) + '</div>' : '', true) +
          campo('Gestor de negócio', esc(s.gestor)) +
          campo('Sistema', esc(s.sistema)) +
          campo('Solicitada em', dataOuVazio(s.dataSolicitacao, 'Não informado')) +
          campo('Neste status', tempoNoStatus(s)) +
        '</dl>' +
        '<div class="det-secao">Prazos</div>' +
        '<dl class="det-grade">' +
          campo('Previsão de início', dataOuVazio(s.previsaoInicio, 'Ainda não definida')) +
          campo('Previsão de término', dataOuVazio(s.previsaoTermino, 'Ainda não definida')) +
          campo('Implantação', dataOuVazio(s.dataImplantacao, 'Ainda não definida')) +
        '</dl>';
      if (typeof elDetalhe.showModal === 'function') elDetalhe.showModal(); else elDetalhe.setAttribute('open', '');
    }
    function fecharDetalhe() {
      if (typeof elDetalhe.close === 'function') elDetalhe.close(); else elDetalhe.removeAttribute('open');
    }
    elDetalhe.addEventListener('click', function (e) {
      // botão Fechar, o X, ou clique no fundo escuro (fora da caixa)
      if (e.target === elDetalhe || e.target.closest('[data-fechar]')) fecharDetalhe();
    });

    function filtrou() { estado.pagina = 1; renderLista(); }
    selStatus.addEventListener('change', function () { estado.filtroStatus = selStatus.value; filtrou(); selStatus.focus(); });
    selGestor.addEventListener('change', function () { estado.filtroGestor = selGestor.value; filtrou(); selGestor.focus(); });
    elBusca.addEventListener('input', function () { estado.termo = elBusca.value; filtrou(); });
    elLista.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-ordem]');
      if (b) {
        var col = b.getAttribute('data-ordem');
        estado.ordem = { coluna: col, sentido: estado.ordem.coluna === col ? -estado.ordem.sentido : 1 };
        filtrou();
        return;
      }
      var linha = e.target.closest('tr[data-numero]');
      // selecionar texto para copiar (o número, o resumo) não abre o detalhe
      if (linha && !String(window.getSelection ? window.getSelection() : '')) abrirDetalhe(linha.getAttribute('data-numero'));
    });
    elLista.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var linha = e.target.closest && e.target.closest('tr[data-numero]');
      if (!linha || e.target !== linha) return;
      e.preventDefault();
      abrirDetalhe(linha.getAttribute('data-numero'));
    });
    elPaginacao.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-pagina]');
      if (!b || b.disabled) return;
      estado.pagina = Number(b.getAttribute('data-pagina'));
      renderLista();
    });
    elPaginacao.addEventListener('change', function (e) {
      if (e.target.id !== 'selPorPagina') return;
      estado.porPagina = Number(e.target.value);
      try { localStorage.setItem('demandas.porPagina', String(estado.porPagina)); } catch (erro) {}
      estado.pagina = 1;
      renderLista();
      var sel = document.getElementById('selPorPagina');
      if (sel) sel.focus();
    });

    // ---- servidor ----

    function pedirJson(url, opcoes) {
      return fetch(url, opcoes).then(function (r) {
        if (r.status === 401) { window.location.href = '/login.html'; return null; }
        return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
      });
    }

    function pararAcompanhamento() {
      if (acompanhamento) { clearInterval(acompanhamento); acompanhamento = null; }
    }
    // Enquanto há pedido esperando o coletor, relê a lista de tempos em tempos.
    function acompanharPedido() {
      if (acompanhamento) return;
      var voltas = 0;
      acompanhamento = setInterval(function () {
        voltas++;
        if (voltas > ACOMPANHAR_NO_MAXIMO) { pararAcompanhamento(); return; }
        carregar(true);
      }, ACOMPANHAR_A_CADA_MS);
    }

    function carregar(silencioso) {
      return pedirJson('/api/acs', { cache: 'no-store' }).then(function (x) {
        if (!x) return;
        if (!x.ok) {
          if (silencioso) return; // falha passageira durante o acompanhamento: mantém o que está na tela
          elQuando.textContent = '';
          estado.solicitacoes = [];
          renderFiltros();
          elLista.innerHTML = '';
          elAvisos.innerHTML = '<div class="aviso">' + esc((x.j && x.j.erro) || 'Não foi possível carregar as demandas agora.') + '</div>';
          return;
        }
        estado.hoje = x.j.hoje;
        estado.solicitacoes = x.j.solicitacoes || [];
        estado.coleta = x.j.coleta;
        var primeiraCarga = !estado.carregou && estado.solicitacoes.length > 0;
        if (primeiraCarga) {
          estado.carregou = true;
          // A tela abre no que está sendo feito agora: "Em execução". Só na
          // primeira carga - depois vale o que a pessoa escolher.
          if (estado.solicitacoes.some(function (s) { return s.statusCodigo === STATUS_INICIAL; })) estado.filtroStatus = STATUS_INICIAL;
        }
        render();
        // /demandas?demanda=20260511005 já abre o detalhe daquela demanda
        if (primeiraCarga) {
          var pedida = new URLSearchParams(location.search).get('demanda');
          if (pedida) { estado.filtroStatus = ''; renderLista(); abrirDetalhe(pedida); }
        }
        if (estado.coleta && estado.coleta.pedido) acompanharPedido(); else pararAcompanhamento();
      }).catch(function () {
        if (!silencioso) elAvisos.innerHTML = '<div class="aviso">Sem conexão com o servidor. Recarregue a página para tentar de novo.</div>';
      });
    }

    btnAtualizar.addEventListener('click', function () {
      estado.pedindo = true;
      btnAtualizar.disabled = true;
      pedirJson('/api/acs/atualizar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
        .then(function (x) {
          estado.pedindo = false;
          if (!x) return;
          if (!x.ok) {
            btnAtualizar.disabled = false;
            elAvisos.insertAdjacentHTML('afterbegin', '<div class="aviso">' + esc((x.j && x.j.erro) || 'Não foi possível pedir a atualização.') + '</div>');
            return;
          }
          if (estado.coleta) estado.coleta.pedido = x.j.pedido;
          renderColeta();
          acompanharPedido();
        })
        .catch(function () {
          estado.pedindo = false;
          btnAtualizar.disabled = false;
          elAvisos.insertAdjacentHTML('afterbegin', '<div class="aviso">Sem conexão com o servidor. Tente de novo.</div>');
        });
    });

    elRodape.innerHTML = 'A lista vem do ACS uma vez por dia útil, às 8h, e quando alguém clica em Atualizar. ' +
      'A tela de Pontos de Função continua em <a href="/demandas/editar">Demandas e Pontos de Função</a>.';
    elRodape.hidden = false;

    carregar(false);
  })();
</script>
