<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demandas · Kanban BRB</title>

<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F5F5;
    --bg-panel: #FFFFFF;
    --ink: #1E212C;
    --ink-dim: #4B5A68;
    --ink-faint: #7C8894;
    --line: #E5E6E7;
    --line-soft: #EFEFEF;
    --accent: #FF6C0C;
    --accent-soft: #FFE8D9;
    --warn: #A8452E;
    --ok: #0B9C7F;
    --zebra: rgba(30,33,44,0.035);
    --shadow: 0 1px 2px rgba(30,33,44,0.06), 0 1px 1px rgba(30,33,44,0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E212C;
      --bg-panel: #262B38;
      --ink: #F5F5F5;
      --ink-dim: #A7B0BC;
      --ink-faint: #78838F;
      --line: #333846;
      --line-soft: #2A2E3A;
      --accent: #FF8A3D;
      --accent-soft: #3A2A1C;
      --warn: #E2725B;
      --ok: #3EE8C4;
      --zebra: rgba(255,255,255,0.035);
      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Lato, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header.top { background: var(--bg); border-bottom: 1px solid var(--line); padding: 22px 28px; }
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; flex-wrap: wrap; max-width: 1760px; margin: 0 auto;
  }
  .titles h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  .acoes-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .link-topo {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.8rem; color: var(--ink-dim); text-decoration: none;
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px;
    background: var(--bg-panel);
  }
  .link-topo:hover { border-color: var(--accent); color: var(--accent); }
  .link-topo.destaque { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .quem { font-size: 0.78rem; color: var(--ink-faint); }

  main { max-width: 1760px; margin: 0 auto; padding: 22px 28px 60px; }

  .cartao {
    background: var(--bg-panel); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 16px 18px 18px; box-shadow: var(--shadow);
  }
  .topo-cartao { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .cartao h2 { margin: 0 0 3px; font-size: 0.95rem; font-weight: 700; }
  .ajuda { margin: 0 0 14px; font-size: 0.76rem; color: var(--ink-faint); line-height: 1.45; max-width: 800px; }
  .selo {
    flex-shrink: 0; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 10px; border-radius: 100px; background: var(--accent-soft); color: var(--accent);
  }
  .selo:empty { display: none; }
  /* Editar / Visualizar moram DENTRO do cartão, no canto de cima: no
   * cabeçalho da página ficavam longe do conteúdo que mudam. */
  .acoes-cartao { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .aviso {
    margin-bottom: 12px; padding: 9px 12px; border-left: 3px solid var(--warn);
    background: var(--line-soft); border-radius: 0 6px 6px 0; font-size: 0.78rem; color: var(--ink);
  }
  .aviso[hidden] { display: none; }

  /* barra de escolha do mes */
  .barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .barra label { font-size: 0.78rem; font-weight: 700; color: var(--ink-dim); }
  .barra select {
    font: inherit; font-size: 0.85rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 190px;
  }
  .barra select.sel-ano { min-width: 110px; }
  .barra select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .contagem { font-size: 0.76rem; color: var(--ink-faint); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; color: var(--ink-dim);
    background: var(--bg); border: 1px solid var(--line); border-radius: 100px; padding: 6px 14px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.todos { background: none; border-style: dashed; }

  h3.sub { margin: 22px 0 8px; font-size: 0.85rem; font-weight: 700; }
  h3.sub:first-of-type { margin-top: 4px; }
  h3.sub small { font-weight: 400; color: var(--ink-faint); margin-left: 2px; }
  .nota { margin: 8px 0 0; font-size: 0.72rem; color: var(--ink-faint); line-height: 1.45; }

  .tabela-scroll { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
  table.grade { border-collapse: collapse; width: 100%; min-width: 1700px; font-size: 0.8rem; }
  table.grade.resumo { min-width: 0; }
  /* Visualização (tabela): larga e arejada, e rola na horizontal quando a
   * tela é menor que ela. Foi tentado fazer caber à força em 1280-1366 px e o
   * texto ficou "embolado" (Observações com 4-5 linhas, palavra quebrando no
   * meio, título de coluna em 4 linhas) - o usuário preferiu a rolagem. As 12
   * colunas ficam SEMPRE: coluna vazia é informação, mostra o que falta
   * preencher. (Quem quer ver tudo sem rolar usa a vista Cartões.)
   *
   * Seletores com "table.grade.ampla" por inteiro: as regras gerais de
   * .grade th / .grade td vêm DEPOIS no arquivo e, com a mesma força,
   * ganhariam. */
  table.grade.ampla { min-width: 1600px; table-layout: auto; font-size: 0.8rem; }
  table.grade.ampla th { white-space: normal; letter-spacing: 0.03em; font-size: 0.66rem; line-height: 1.35; padding: 10px; vertical-align: bottom; }
  table.grade.ampla td.leitura { padding: 10px; overflow-wrap: break-word; }
  table.grade.ampla td.leitura:nth-child(-n+2), table.grade.ampla td.leitura:nth-child(4),
  table.grade.ampla td.leitura:nth-child(n+9):nth-child(-n+11) { white-space: nowrap; }
  table.grade.ampla tr.totais td { padding: 10px; }
  /* Largura mínima por coluna; Nome e Observações, que são o texto que se lê,
   * ficam com a maior folga. */
  table.grade.ampla th:nth-child(1) { min-width: 125px; }
  table.grade.ampla th:nth-child(2) { min-width: 115px; }
  table.grade.ampla th:nth-child(3) { min-width: 220px; }
  table.grade.ampla th:nth-child(4) { min-width: 115px; }
  table.grade.ampla th:nth-child(5) { min-width: 110px; }
  table.grade.ampla th:nth-child(6) { min-width: 125px; }
  table.grade.ampla th:nth-child(7) { min-width: 85px; }
  table.grade.ampla th:nth-child(8) { min-width: 105px; }
  table.grade.ampla th:nth-child(n+9):nth-child(-n+11) { min-width: 110px; }
  table.grade.ampla th:nth-child(12) { min-width: 280px; }

  /* Relevo (a tabela estava lisa demais): linha separando cada demanda,
   * listras alternadas, fio vertical entre colunas e cabeçalho com acento.
   * Os fios ajudam justamente nas colunas vazias, onde o olho se perdia. */
  table.grade.ampla th, table.grade.resumo th { border-bottom: 2px solid var(--accent); }
  table.grade.ampla td { border-bottom: 1px solid var(--line); }
  table.grade.ampla td + td, table.grade.ampla th + th { border-left: 1px solid var(--line-soft); }
  table.grade.ampla tbody tr:nth-child(even) td { background: var(--zebra); }
  table.grade.ampla tbody tr:hover td { background: var(--line-soft); }
  table.grade.ampla tbody tr:last-child td { border-bottom: 0; }
  table.grade.ampla tr.totais td { border-top: 2px solid var(--line); }
  table.grade.resumo tbody tr:nth-child(even) td { background: var(--zebra); }
  table.grade.resumo tr.consolidado td { border-top: 2px solid var(--accent); }

  /* seletor Cartões | Tabela, à direita dos meses */
  .barra .vista { margin-left: auto; }
  .barra .vista label { margin-right: 2px; }

  /* Vista em cartões: um bloco por demanda. Nunca rola. */
  .cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
  .cartao-dem {
    display: flex; flex-direction: column; gap: 12px; padding: 14px 16px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); transition: border-color 0.15s ease, box-shadow 0.15s ease;
    break-inside: avoid;
  }
  .cartao-dem { cursor: pointer; }
  .cartao-dem:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.22); }
  .cartao-dem:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cartao-dem .prog { display: flex; flex-direction: column; gap: 5px; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
  .cartao-dem .prog-barra { height: 6px; border-radius: 100px; background: var(--line-soft); overflow: hidden; }
  .cartao-dem .prog-barra i { display: block; height: 100%; background: var(--ok); border-radius: 100px; }
  .cartao-dem .prog-txt { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-dim); }
  .cartao-dem .resumo-obs { margin: 0; font-size: 0.8rem; line-height: 1.45; color: var(--ink-dim); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cartao-dem .rodape-cartao { display: flex; justify-content: space-between; gap: 8px; margin-top: auto; font-size: 0.72rem; color: var(--ink-faint); }
  .cartao-dem .rodape-cartao .mais { color: var(--accent); font-weight: 600; }
  .cartao-dem .rodape-cartao .faltam { color: var(--accent); }

  /* Detalhe da demanda: o cartão completo, por cima da tela */
  .fundo-detalhe { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(0,0,0,0.55); }
  .detalhe-dem { position: relative; display: flex; flex-direction: column; gap: 14px; width: min(720px, 100%); max-height: calc(100vh - 40px);
    overflow-y: auto; padding: 18px 22px 20px; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45); }
  .detalhe-dem .topo { font-size: 0.8rem; }
  .detalhe-dem .topo .pf { margin-left: auto; }
  .detalhe-dem .nome { font-size: 1.1rem; }
  .detalhe-dem .fechar { background: none; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 6px; width: 28px; height: 28px;
    font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .detalhe-dem .fechar:hover { color: var(--ink); border-color: var(--ink-faint); }
  .detalhe-dem .mes-det { font-size: 0.78rem; color: var(--ink-faint); }
  .detalhe-dem .rodape-det { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-top: 10px; border-top: 1px solid var(--line-soft); font-size: 0.74rem; color: var(--ink-faint); }
  .cartao-dem .topo, .detalhe-dem .topo {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 0.74rem; color: var(--ink-faint);
  }
  .cartao-dem .ids, .detalhe-dem .ids { display: flex; flex-wrap: wrap; gap: 4px 12px; font-variant-numeric: tabular-nums; }
  .cartao-dem .ids a, .detalhe-dem .ids a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .cartao-dem .ids a:hover, .detalhe-dem .ids a:hover { text-decoration: underline; }
  .cartao-dem .nome, .detalhe-dem .nome { font-size: 0.92rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .pf {
    flex-shrink: 0; font-size: 0.74rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 2px 10px; border-radius: 100px; background: var(--line-soft); color: var(--ink);
  }
  .pf.analise { background: var(--accent-soft); color: var(--accent); }
  .pf.sem { font-weight: 400; color: var(--ink-faint); }
  .falta { color: var(--ink-faint); opacity: 0.7; }

  .rot { display: block; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); }
  .etapas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .etapa { border-top: 3px solid var(--line); padding-top: 6px; min-width: 0; }
  .etapa.feita { border-top-color: var(--ok); }
  .etapa .rot { white-space: normal; line-height: 1.25; min-height: 2.5em; letter-spacing: 0; font-size: 0.62rem; }
  .etapa strong { display: block; margin-top: 2px; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .etapa:not(.feita) strong { color: var(--ink-faint); font-weight: 600; }

  .datas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .datas .rot { margin-bottom: 1px; }
  .obs { border-top: 1px solid var(--line-soft); padding-top: 8px; }
  .obs p { margin: 2px 0 0; font-size: 0.8rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .grade th {
    text-align: left; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-dim); background: var(--line-soft); padding: 9px 10px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .grade th.num, .grade td.num { text-align: right; }
  .grade td { padding: 5px 6px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .grade tbody tr:hover td { background: var(--line-soft); }
  /* linha para a qual o usuario veio do detalhe ("Editar esta demanda") */
  .grade tbody tr.alvo td { background: var(--accent-soft); border-bottom-color: var(--accent); animation: pulsoAlvo 1.4s ease-out 1; }
  .grade tbody tr.alvo td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
  @keyframes pulsoAlvo { 0% { background: var(--accent); } 100% { background: var(--accent-soft); } }
  @media (prefers-reduced-motion: reduce) { .grade tbody tr.alvo td { animation: none; } }
  .grade td.leitura { padding: 8px 10px; }
  .grade td.leitura.obs { white-space: pre-wrap; }
  .grade td.c-numero input, .grade td.c-pontos input { text-align: right; font-variant-numeric: tabular-nums; }
  .grade td.leitura.num { font-variant-numeric: tabular-nums; }
  .resumo td { padding: 9px 10px; font-variant-numeric: tabular-nums; }
  .resumo tr.consolidado td { font-weight: 700; background: var(--line-soft); border-top: 1px solid var(--line); border-bottom: 0; }
  .resumo td.destaque { font-weight: 700; color: var(--accent); }

  /* Cada celula editavel e uma caixa visivel: sem borda/fundo, uma celula
   * vazia parecia so espaco em branco e ninguem percebia que dava pra digitar. */
  .grade td input, .grade td textarea {
    display: block; width: 100%; color: var(--ink); font: inherit; resize: vertical;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
  }
  .grade td textarea { min-height: 38px; }
  .grade td input:hover, .grade td textarea:hover { border-color: var(--ink-faint); }
  .grade td input:focus, .grade td textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--bg-panel);
  }
  .grade td input::placeholder, .grade td textarea::placeholder { color: var(--ink-faint); opacity: 0.75; }
  .grade a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .grade a:hover { text-decoration: underline; }
  .abrir { display: inline-block; padding: 3px 3px 0; font-size: 0.72rem; }
  .abrir[hidden] { display: none; }

  td.acoes { white-space: nowrap; padding: 6px 8px; text-align: left; }
  .estado { display: block; min-height: 1em; margin-top: 3px; font-size: 0.7rem; color: var(--ink-faint); }
  .estado.salvo { color: var(--ok); }
  .estado.erro { color: var(--warn); font-weight: 700; }
  .btn-remover {
    display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 0.72rem; font-weight: 700;
    cursor: pointer; color: var(--ink-dim); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
  }
  .btn-remover:hover { color: var(--warn); border-color: var(--warn); }
  .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  tr.totais td {
    padding: 9px 10px; font-weight: 700; background: var(--line-soft); border-bottom: 0;
    border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  tr.totais td.num { text-align: right; }

  .btn-add {
    margin-top: 14px; font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer;
    border: 1px dashed var(--accent); color: var(--accent); background: none;
    border-radius: 7px; padding: 8px 14px;
  }
  .btn-add:hover { background: var(--accent); color: #fff; border-style: solid; }
  .btn-add:disabled { opacity: 0.6; cursor: default; }

  .vazio { padding: 22px; text-align: center; color: var(--ink-faint); font-size: 0.8rem; line-height: 1.5; }
  .vazio[hidden] { display: none; }

  @media print {
    body { background: #fff; }
    .acoes-topo, .chips, .barra, .btn-add { display: none !important; }
    .cartao { box-shadow: none; border: 0; padding: 0; }
    .tabela-scroll { overflow: visible; }
    table.grade { min-width: 0; font-size: 0.7rem; }
  }
</style>

<header class="top">
  <div class="top-row">
    <div class="titles">
      <h1>Demandas</h1>
    </div>
    <div class="acoes-topo" id="acoesTopo">
      <a class="link-topo" href="/">Voltar ao board</a>
      <a class="link-topo" href="/dashboard">Dashboard</a>
      <span class="quem" id="quem"></span>
    </div>
  </div>
</header>

<main>
  <div class="cartao">
    <div class="topo-cartao">
      <div>
        <h2>Demandas e Pontos de Função</h2>
        <p class="ajuda" id="ajuda">Carregando…</p>
      </div>
      <div class="acoes-cartao" id="acoesCartao"><span class="selo" id="selo"></span></div>
    </div>
    <div class="barra" id="barra"></div>
    <div class="aviso" id="aviso" role="alert" hidden></div>
    <div id="area"><div class="vazio">Carregando…</div></div>
    <div class="vazio" id="vazio" hidden></div>
    <div id="acoesRodape"></div>
  </div>
</main>

<script>
  (function () {
    // Mesma página em duas rotas: /demandas (ver) e /demandas/editar (preencher).
    var EDITANDO = /\/editar\/?$/.test(location.pathname);

    var CAMPOS = [
      { chave: 'demandaAcs', rotulo: 'Demanda/Sustentação ACS', tipo: 'texto', larg: 160, dica: 'ex.: 20260525005' },
      { chave: 'artefatoJira', rotulo: 'Artefato Jira', tipo: 'jira', larg: 170, dica: 'chave ou link' },
      { chave: 'nome', rotulo: 'Nome da Demanda/Sustentação', tipo: 'texto', larg: 330, dica: 'nome da demanda' },
      { chave: 'pontosTotal', rotulo: 'Pontos de Função (total)', tipo: 'pontos', larg: 150, dica: 'número ou em análise' },
      { chave: 'documentacao', rotulo: 'Documentação (30%)', tipo: 'numero', larg: 120, dica: '0,0' },
      { chave: 'desenvolvimento', rotulo: 'Desenvolvimento (40%)', tipo: 'numero', larg: 135, dica: '0,0' },
      { chave: 'teste', rotulo: 'Teste (20%)', tipo: 'numero', larg: 100, dica: '0,0' },
      { chave: 'implantacao', rotulo: 'Implantação (10%)', tipo: 'numero', larg: 120, dica: '0,0' },
      { chave: 'inicioAtendimento', rotulo: 'Início do Atendimento - ACS', tipo: 'data', larg: 160 },
      { chave: 'conclusaoPrevista', rotulo: 'Conclusão prevista (SLA)', tipo: 'data', larg: 160 },
      { chave: 'previsaoExpedicao', rotulo: 'Previsão de Expedição', tipo: 'data', larg: 160 },
      { chave: 'observacoes', rotulo: 'Observações', tipo: 'area', larg: 340, dica: 'observações' }
    ];
    var COLUNAS_SOMA = ['pontosTotal', 'documentacao', 'desenvolvimento', 'teste', 'implantacao'];
    var NOMES_MES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto',
      'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

    var estado = {
      editor: false,
      demandas: [],
      disponiveis: [],   // meses que já têm registro (cronológico)
      resumo: null,      // { porMes, consolidado } - vem do servidor
      mes: null,         // edição: o mês aberto
      selecionados: [],  // visualização: os meses marcados
      ano: 'todos',      // visualização: o ano do filtro ('AAAA' ou 'todos')
      // visualização: cartões é o padrão; ?vista=tabela volta para a tabela
      vista: new URLSearchParams(location.search).get('vista') === 'tabela' ? 'tabela' : 'cartoes',
      aberta: new URLSearchParams(location.search).get('demanda')
    };
    var area = document.getElementById('area');
    var timerAviso = null;

    /* ---------- utilidades ---------- */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtNum(v) {
      return v === null || v === undefined ? '' :
        Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }
    function fmtData(iso) {
      if (!iso) return '';
      var p = String(iso).split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
    }
    function quemQuando(d) {
      if (!d.atualizadoPor) return '';
      var quando = d.atualizadoEm ? new Date(d.atualizadoEm).toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
      }) : '';
      return 'Última alteração: ' + d.atualizadoPor + (quando ? ' em ' + quando : '');
    }
    function rotuloJira(v) {
      var m = /\/browse\/([A-Za-z0-9-]+)/.exec(v || '');
      return m ? m[1] : v;
    }

    function doisDigitos(n) { return (n < 10 ? '0' : '') + n; }
    function mesValido(m) { return /^\d{4}-(0[1-9]|1[0-2])$/.test(m || ''); }
    function mesAtual() {
      var d = new Date();
      return d.getFullYear() + '-' + doisDigitos(d.getMonth() + 1);
    }
    function rotuloMes(mes) {
      var p = mes.split('-');
      return NOMES_MES[Number(p[1]) - 1] + ' de ' + p[0];
    }
    function rotuloCurto(mes) {
      var p = mes.split('-');
      return NOMES_MES[Number(p[1]) - 1].slice(0, 3) + '/' + p[0];
    }
    function parametro(nome) {
      return new URLSearchParams(location.search).get(nome);
    }
    function guardarNaUrl(nome, valor) {
      var p = new URLSearchParams(location.search);
      if (valor) p.set(nome, valor); else p.delete(nome);
      var q = p.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
    }

    function pedir(url, opcoes) {
      return fetch(url, opcoes).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      });
    }
    function carregarMeses(meses) {
      return pedir('/api/demandas?meses=' + encodeURIComponent(meses.join(',')), { cache: 'no-store' });
    }

    function mostrarAviso(msg) {
      var el = document.getElementById('aviso');
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(timerAviso);
      timerAviso = setTimeout(function () { el.hidden = true; }, 8000);
    }
    function falhaAoCarregar(msg) {
      area.innerHTML = '<div class="vazio">' + esc(msg || 'Não foi possível carregar.') + '</div>';
      document.getElementById('ajuda').textContent = '';
    }

    /* ---------- células e linhas ---------- */
    function valorDe(d, c) {
      if (c.tipo === 'pontos') return d.emAnalise ? 'em análise' : fmtNum(d.pontosTotal);
      if (c.tipo === 'numero') return fmtNum(d[c.chave]);
      return d[c.chave] || '';
    }

    function celulaEditavel(d, c) {
      var v = esc(valorDe(d, c));
      var aria = ' aria-label="' + esc(c.rotulo) + '" data-campo="' + c.chave + '"';
      var dica = c.dica ? ' placeholder="' + esc(c.dica) + '"' : '';
      if (c.tipo === 'area') return '<textarea rows="2"' + dica + aria + '>' + v + '</textarea>';
      if (c.tipo === 'data') return '<input type="date"' + aria + ' value="' + v + '">';
      var extra = c.tipo === 'numero' || c.tipo === 'pontos' ? ' inputmode="decimal"' : '';
      var h = '<input type="text"' + extra + dica + aria + ' value="' + v + '">';
      if (c.tipo === 'jira') {
        h += '<a class="abrir" target="_blank" rel="noopener noreferrer"' +
          (d.artefatoUrl ? ' href="' + esc(d.artefatoUrl) + '"' : ' hidden') + '>abrir no Jira</a>';
      }
      return h;
    }

    // Campo vazio aparece como "—" apagado, igual nos cartões: o que falta
    // preencher tem que ficar visível, não virar um buraco em branco.
    function celulaLeitura(d, c) {
      var html;
      if (c.tipo === 'jira') {
        html = !d.artefatoJira ? ''
          : d.artefatoUrl
            ? '<a href="' + esc(d.artefatoUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(rotuloJira(d.artefatoJira)) + '</a>'
            : esc(d.artefatoJira);
      } else if (c.tipo === 'data') {
        html = esc(fmtData(d[c.chave]));
      } else {
        html = esc(valorDe(d, c));
      }
      return html === '' ? '<span class="falta">—</span>' : html;
    }

    var ICONE_LIXEIRA = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';

    function linhaHtml(d, editavel) {
      var h = '<tr data-id="' + d.id + '">';
      // Excluir fica na PRIMEIRA coluna: a grade de edição é larga e rola, e
      // na última coluna o botão ficava fora da tela - parecia que não existia.
      if (editavel) {
        h += '<td class="acoes" title="' + esc(quemQuando(d)) + '">' +
          '<button type="button" class="btn-remover" aria-label="Excluir linha">' + ICONE_LIXEIRA + ' Excluir</button>' +
          '<span class="estado"></span></td>';
      }
      CAMPOS.forEach(function (c) {
        if (editavel) {
          h += '<td class="c-' + c.tipo + '">' + celulaEditavel(d, c) + '</td>';
        } else {
          var classes = 'leitura' + (c.tipo === 'numero' || c.tipo === 'pontos' ? ' num' : '') + (c.tipo === 'area' ? ' obs' : '');
          h += '<td class="' + classes + '">' + celulaLeitura(d, c) + '</td>';
        }
      });
      return h + '</tr>';
    }

    // Na edição a largura mínima de cada coluna vem do JS (são caixas de
    // digitar). Na visualização ela vem do CSS (table.grade.ampla), por coluna.
    function cabecalho(editavel, ampla) {
      var h = '<thead><tr>';
      if (editavel) h += '<th style="min-width:108px"><span class="so-leitor">Ações</span></th>';
      CAMPOS.forEach(function (c) {
        if (ampla) {
          h += '<th' + (c.tipo === 'numero' || c.tipo === 'pontos' ? ' class="num"' : '') + '>' + esc(c.rotulo) + '</th>';
        } else {
          h += '<th style="min-width:' + c.larg + 'px">' + esc(c.rotulo) + '</th>';
        }
      });
      return h + '</tr></thead>';
    }

    // totais: objeto { pontosTotal, documentacao, ... }; vazio ou zero vira "—"
    function rodapeTotais(totais, editavel) {
      // na edição a coluna de ações vem antes, então o rótulo cobre uma a mais
      var h = '<tfoot><tr class="totais"><td colspan="' + (editavel ? 4 : 3) + '">Total</td>';
      COLUNAS_SOMA.forEach(function (k) {
        h += '<td class="num" data-total="' + k + '">' + (fmtNum(totais[k]) || '—') + '</td>';
      });
      return h + '<td colspan="4"></td></tr></tfoot>';
    }

    function somar(chave) {
      var soma = 0, algum = false;
      estado.demandas.forEach(function (d) {
        if (typeof d[chave] === 'number') { soma += d[chave]; algum = true; }
      });
      return algum ? Math.round(soma * 100) / 100 : null;
    }
    function totaisDaTela() {
      var t = {};
      COLUNAS_SOMA.forEach(function (k) { t[k] = somar(k); });
      return t;
    }
    function atualizarTotais() {
      var t = totaisDaTela();
      COLUNAS_SOMA.forEach(function (k) {
        var td = area.querySelector('[data-total="' + k + '"]');
        if (td) td.textContent = fmtNum(t[k]) || '—';
      });
    }

    /* ======================================================================
     * EDIÇÃO  (/demandas/editar) - um mês por vez
     * ====================================================================== */
    function demandaDaLinha(tr) {
      var id = Number(tr.getAttribute('data-id'));
      return estado.demandas.filter(function (d) { return d.id === id; })[0];
    }

    function atualizarVazio() {
      var vazio = document.getElementById('vazio');
      vazio.hidden = estado.demandas.length > 0;
      vazio.textContent = 'Nenhuma demanda em ' + rotuloMes(estado.mes) + '. Clique em "+ Adicionar linha" para começar.';
      var c = document.getElementById('contagem');
      if (c) c.textContent = estado.demandas.length + (estado.demandas.length === 1 ? ' demanda' : ' demandas') + ' neste mês';
    }

    // Só o campo salvo é mesclado no estado: devolver a linha inteira
    // poderia apagar o que a pessoa já digitou em outra célula enquanto esta
    // resposta voltava.
    function mesclar(d, r, campo) {
      if (campo === 'pontosTotal') { d.pontosTotal = r.pontosTotal; d.emAnalise = r.emAnalise; }
      else d[campo] = r[campo];
      if (campo === 'artefatoJira') d.artefatoUrl = r.artefatoUrl;
      d.atualizadoPor = r.atualizadoPor;
      d.atualizadoEm = r.atualizadoEm;
    }

    function refletir(tr, d, campo) {
      var c = CAMPOS.filter(function (x) { return x.chave === campo; })[0];
      var el = tr.querySelector('[data-campo="' + campo + '"]');
      if (el && document.activeElement !== el) el.value = valorDe(d, c);
      if (campo === 'artefatoJira') {
        var a = tr.querySelector('.abrir');
        if (a) {
          if (d.artefatoUrl) { a.href = d.artefatoUrl; a.hidden = false; }
          else { a.removeAttribute('href'); a.hidden = true; }
        }
      }
      tr.querySelector('.acoes').title = quemQuando(d);
      atualizarTotais();
    }

    function marcar(tr, tipo, msg) {
      var el = tr.querySelector('.estado');
      if (!el) return;
      clearTimeout(el._timer);
      el.className = 'estado' + (tipo ? ' ' + tipo : '');
      el.textContent = tipo === 'salvando' ? 'Salvando…' : tipo === 'salvo' ? 'Salvo' : tipo === 'erro' ? 'Erro' : '';
      el.title = msg || '';
      if (tipo === 'salvo') el._timer = setTimeout(function () { el.textContent = ''; }, 2500);
    }

    function salvarCampo(tr, campo, valor) {
      var d = demandaDaLinha(tr);
      if (!d) return;
      marcar(tr, 'salvando');
      var corpo = {};
      corpo[campo] = valor;
      pedir('/api/demandas/' + d.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      })
        .then(function (res) {
          if (!res.ok) {
            marcar(tr, 'erro', res.j.erro);
            mostrarAviso(res.j.erro || 'Não foi possível salvar.');
            return;
          }
          mesclar(d, res.j.demanda, campo);
          refletir(tr, d, campo);
          marcar(tr, 'salvo');
        })
        .catch(function () {
          marcar(tr, 'erro', 'Falha ao conversar com o servidor.');
          mostrarAviso('Falha ao conversar com o servidor. Confira a conexão e tente de novo.');
        });
    }

    // Diz QUAL demanda vai sair: número e nome, e de que mês. Linha ainda em
    // branco (recém-criada, sem nada digitado) é dita como tal em vez de "#12".
    function mensagemExcluir(d) {
      var mes = rotuloMes(d.mes || estado.mes);
      var quem = [d.demandaAcs, d.nome].filter(Boolean).join(' - ');
      if (!quem) return 'Deseja realmente excluir esta linha em branco de ' + mes + '?';
      return 'Deseja realmente excluir a demanda ' + quem + '?\n\nEla sai da lista de ' + mes + '.';
    }

    function removerLinha(tr) {
      var d = demandaDaLinha(tr);
      if (!d) return;
      if (!confirm(mensagemExcluir(d))) return;
      pedir('/api/demandas/' + d.id, { method: 'DELETE' })
        .then(function (res) {
          if (!res.ok) { mostrarAviso(res.j.erro || 'Não foi possível remover.'); return; }
          estado.demandas = estado.demandas.filter(function (x) { return x.id !== d.id; });
          tr.parentNode.removeChild(tr);
          atualizarTotais();
          atualizarVazio();
        })
        .catch(function () { mostrarAviso('Falha ao conversar com o servidor.'); });
    }

    function adicionarLinha(botao) {
      var mes = estado.mes;
      // Enquanto troca de mês a grade some da tela; adicionar aí não tem onde aparecer.
      if (!document.getElementById('corpo')) return;
      botao.disabled = true;
      pedir('/api/demandas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mes: mes })
      })
        .then(function (res) {
          botao.disabled = false;
          if (!res.ok) { mostrarAviso(res.j.erro || 'Não foi possível criar a linha.'); return; }
          var corpo = document.getElementById('corpo');
          if (mes !== estado.mes || !corpo) return; // trocou de mês enquanto criava
          estado.demandas.push(res.j.demanda);
          corpo.insertAdjacentHTML('beforeend', linhaHtml(res.j.demanda, true));
          atualizarVazio();
          var primeiro = corpo.lastElementChild.querySelector('input, textarea');
          if (primeiro) primeiro.focus();
        })
        .catch(function () {
          botao.disabled = false;
          mostrarAviso('Falha ao conversar com o servidor.');
        });
    }

    /* Vindo do detalhe ("Editar esta demanda"), a linha da demanda fica
     * destacada, centralizada na tela e com o cursor no primeiro campo.
     * O destaque sai quando o usuário começa a mexer em outra linha. */
    function destacarAlvo() {
      var tr = estado.alvo && document.querySelector('#corpo tr[data-id="' + String(estado.alvo).replace(/[^0-9a-z-]/gi, '') + '"]');
      if (!tr) { estado.alvo = null; return; }
      tr.classList.add('alvo');
      if (tr.scrollIntoView) tr.scrollIntoView({ block: 'center' });
      var campo = tr.querySelector('input, textarea');
      if (campo) campo.focus({ preventScroll: true });
    }
    function limparAlvo() {
      estado.alvo = null;
      guardarNaUrl('demanda', '');
      var marcada = document.querySelector('#corpo tr.alvo');
      if (marcada) marcada.classList.remove('alvo');
    }

    function montarGrade() {
      area.innerHTML = '<div class="tabela-scroll"><table class="grade">' + cabecalho(true) +
        '<tbody id="corpo">' + estado.demandas.map(function (d) { return linhaHtml(d, true); }).join('') + '</tbody>' +
        rodapeTotais(totaisDaTela(), true) + '</table></div>';
      atualizarVazio();
      destacarAlvo();

      var corpo = document.getElementById('corpo');
      corpo.addEventListener('change', function (e) {
        var campo = e.target.getAttribute('data-campo');
        if (!campo) return;
        salvarCampo(e.target.closest('tr'), campo, e.target.value);
      });
      corpo.addEventListener('focusin', function (e) {
        var tr = e.target.closest('tr');
        if (estado.alvo && tr && String(tr.getAttribute('data-id')) !== String(estado.alvo)) limparAlvo();
      });
      corpo.addEventListener('click', function (e) {
        var botao = e.target.closest('.btn-remover');
        if (botao) removerLinha(botao.closest('tr'));
      });
    }

    // Anos para escolher: do mais antigo com registro (ou o ano passado) até o
    // ano que vem, sem buracos - dá para abrir o ano novo antes de ele começar
    // e preencher um mês que ficou para trás.
    function anosDoSeletor() {
      var atual = Number(mesAtual().slice(0, 4));
      var anos = estado.disponiveis.map(function (m) { return Number(m.slice(0, 4)); })
        .concat([atual - 1, atual + 1, Number(estado.mes.slice(0, 4))]);
      var menor = Math.min.apply(null, anos);
      var maior = Math.max.apply(null, anos);
      var lista = [];
      for (var a = maior; a >= menor; a--) lista.push(a);
      return lista;
    }

    function mesEscolhido() {
      return document.getElementById('selAno').value + '-' + document.getElementById('selMes').value;
    }

    function atualizarRotulosEdicao() {
      var btn = document.getElementById('btnAdd');
      if (btn) btn.textContent = '+ Adicionar linha em ' + rotuloMes(estado.mes);
      var ver = document.getElementById('linkVisualizar');
      if (ver) ver.href = '/demandas?meses=' + estado.mes;
    }

    function trocarMes(novo) {
      if (estado.alvo) limparAlvo();
      estado.mes = novo;
      guardarNaUrl('mes', novo);
      atualizarRotulosEdicao();
      area.innerHTML = '<div class="vazio">Carregando…</div>';
      document.getElementById('vazio').hidden = true;
      carregarMeses([novo]).then(function (res) {
        if (novo !== estado.mes) return; // escolheu outro mês no meio do caminho
        if (!res.ok) return falhaAoCarregar(res.j.erro);
        estado.demandas = res.j.demandas;
        estado.disponiveis = res.j.mesesDisponiveis;
        montarGrade();
      }).catch(function () { falhaAoCarregar(); });
    }

    function montarBarraEdicao() {
      var ano = estado.mes.slice(0, 4);
      var mm = estado.mes.slice(5);
      var anos = anosDoSeletor().map(function (a) {
        return '<option value="' + a + '"' + (String(a) === ano ? ' selected' : '') + '>' + a + '</option>';
      }).join('');
      var meses = NOMES_MES.map(function (nome, i) {
        var v = doisDigitos(i + 1);
        return '<option value="' + v + '"' + (v === mm ? ' selected' : '') + '>' + nome + '</option>';
      }).join('');
      document.getElementById('barra').innerHTML =
        '<label for="selAno">Ano</label><select id="selAno" class="sel-ano">' + anos + '</select>' +
        '<label for="selMes">Mês</label><select id="selMes">' + meses + '</select>' +
        '<span class="contagem" id="contagem"></span>';
      ['selAno', 'selMes'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', function () { trocarMes(mesEscolhido()); });
      });

      document.getElementById('acoesRodape').innerHTML = '<button type="button" class="btn-add" id="btnAdd"></button>';
      document.getElementById('btnAdd').addEventListener('click', function () { adicionarLinha(this); });

      var ver = document.createElement('a');
      ver.className = 'link-topo destaque';
      ver.id = 'linkVisualizar';
      ver.textContent = 'Visualizar';
      document.getElementById('acoesCartao').appendChild(ver);

      document.getElementById('selo').textContent = 'Edição liberada';
      document.getElementById('ajuda').textContent = 'Escolha o ano e o mês: a entrega é mensal e cada mês tem registros novos ' +
        '(a mesma demanda pode aparecer em vários meses). Clique em qualquer caixa para preencher; as colunas podem ' +
        'ficar em branco. Cada alteração é salva ao sair do campo, e os valores de cada fase são digitados ' +
        '(os percentuais nos títulos são só referência).';
    }

    function iniciarEdicao() {
      var param = parametro('mes');
      estado.mes = mesValido(param) ? param : mesAtual();
      estado.alvo = parametro('demanda');
      carregarMeses([estado.mes]).then(function (res) {
        if (!res.ok) return falhaAoCarregar(res.j.erro);
        if (!res.j.editor) { location.replace('/demandas'); return; }
        estado.editor = true;
        estado.demandas = res.j.demandas;
        estado.disponiveis = res.j.mesesDisponiveis;
        montarBarraEdicao();
        atualizarRotulosEdicao();
        montarGrade();
      }).catch(function () { falhaAoCarregar(); });
    }

    /* ======================================================================
     * VISUALIZAÇÃO  (/demandas) - vários meses, resumo e consolidado
     * ====================================================================== */
    function celulaResumo(v, destaque) {
      return '<td class="num' + (destaque ? ' destaque' : '') + '">' + (fmtNum(v) || '0') + '</td>';
    }
    function linhaResumo(rotulo, o, consolidado) {
      return '<tr' + (consolidado ? ' class="consolidado"' : '') + '><td>' + esc(rotulo) + '</td>' +
        celulaResumo(o.demandas) + celulaResumo(o.pontosTotal) + celulaResumo(o.documentacao) +
        celulaResumo(o.desenvolvimento) + celulaResumo(o.teste) + celulaResumo(o.implantacao) +
        celulaResumo(o.entregue, true) + '</tr>';
    }

    function blocoResumo() {
      var r = estado.resumo;
      var varios = r.porMes.length > 1;
      var h = '<h3 class="sub">' + (varios ? 'Consolidado dos meses selecionados' : 'Resumo de ' + esc(rotuloMes(r.porMes[0].mes))) + '</h3>' +
        '<div class="tabela-scroll"><table class="grade resumo"><thead><tr><th>Mês</th><th class="num">Demandas</th>' +
        '<th class="num">Pontos de Função (total)</th><th class="num">Documentação</th><th class="num">Desenvolvimento</th>' +
        '<th class="num">Teste</th><th class="num">Implantação</th><th class="num">Total entregue</th></tr></thead><tbody>';
      r.porMes.forEach(function (m) { h += linhaResumo(rotuloMes(m.mes), m, false); });
      if (varios) h += linhaResumo('Consolidado', r.consolidado, true);
      h += '</tbody></table></div>';
      if (varios) {
        h += '<p class="nota">As fases são o que foi entregue em cada mês, então somam. Os Pontos de Função (total) são da ' +
          'demanda: se o mesmo número ACS aparece em mais de um mês, entra uma vez só no consolidado (com o valor do mês ' +
          'mais recente) — por isso o consolidado pode ser menor que a soma dos meses.</p>';
      }
      return h;
    }

    /* ---- Vista em cartões: um bloco por demanda, nunca rola ----
     * Campo vazio aparece como "—" apagado, de propósito: o que falta
     * preencher precisa ficar visível, não sumir. A linha de cima de cada
     * etapa fica verde quando a etapa tem valor maior que zero, para ver de
     * relance em que pé a demanda está. */
    var ETAPAS = [
      { chave: 'documentacao', rotulo: 'Documentação', pct: '30%' },
      { chave: 'desenvolvimento', rotulo: 'Desenvolvimento', pct: '40%' },
      { chave: 'teste', rotulo: 'Teste', pct: '20%' },
      { chave: 'implantacao', rotulo: 'Implantação', pct: '10%' }
    ];
    var DATAS = [
      { chave: 'inicioAtendimento', rotulo: 'Início ACS' },
      { chave: 'conclusaoPrevista', rotulo: 'Conclusão (SLA)' },
      { chave: 'previsaoExpedicao', rotulo: 'Expedição' }
    ];

    function linkJira(d) {
      if (!d.artefatoJira) return '';
      return d.artefatoUrl
        ? '<a href="' + esc(d.artefatoUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(rotuloJira(d.artefatoJira)) + '</a>'
        : esc(d.artefatoJira);
    }
    function seloPf(d) {
      return d.emAnalise ? '<span class="pf analise">em análise</span>'
        : d.pontosTotal !== null ? '<span class="pf">' + fmtNum(d.pontosTotal) + ' PF</span>'
        : '<span class="pf sem">sem pontos</span>';
    }
    function cabecaDemanda(d) {
      var jira = linkJira(d);
      // Os espaços entre os blocos não mudam o desenho (são itens de flex/grid),
      // mas sem eles o texto sai colado para leitor de tela e para copiar/colar.
      return '<span class="ids"><span>' + (d.demandaAcs ? esc(d.demandaAcs) : '<span class="falta">sem nº ACS</span>') + '</span> ' +
        (jira ? '<span>' + jira + '</span>' : '') + '</span> ';
    }
    function totalEntregue(d) {
      var t = 0;
      ETAPAS.forEach(function (e) { if (typeof d[e.chave] === 'number') t += d[e.chave]; });
      return Math.round(t * 100) / 100;
    }
    // Quantos dos 12 campos da demanda já estão preenchidos ("em análise" conta).
    function preenchimento(d) {
      var campos = [d.demandaAcs, d.artefatoJira, d.nome, d.observacoes,
        d.emAnalise || d.pontosTotal !== null, d.documentacao, d.desenvolvimento, d.teste, d.implantacao,
        d.inicioAtendimento, d.conclusaoPrevista, d.previsaoExpedicao];
      var feitos = campos.filter(function (v) { return v !== null && v !== undefined && v !== '' && v !== false; }).length;
      return { feitos: feitos, total: campos.length };
    }

    /* Cartão enxuto: o que se lê de relance. Tudo o mais (inclusive o que
     * ainda está vazio) aparece ao clicar, em detalheHtml. */
    function cartaoHtml(d) {
      var entregue = totalEntregue(d);
      var temTotal = !d.emAnalise && typeof d.pontosTotal === 'number' && d.pontosTotal > 0;
      var pct = temTotal ? Math.min(100, Math.round(entregue / d.pontosTotal * 100)) : 0;
      var txt = temTotal ? fmtNum(entregue) + ' de ' + fmtNum(d.pontosTotal) + ' PF entregues' : fmtNum(entregue) + ' PF entregues';
      var pr = preenchimento(d);
      var rotulo = 'Ver detalhes da demanda ' + (d.demandaAcs || d.nome || '');
      return '<article class="cartao-dem" data-id="' + d.id + '" tabindex="0" role="button" aria-label="' + esc(rotulo) + '">' +
        '<div class="topo">' + cabecaDemanda(d) + seloPf(d) + '</div>' +
        '<div class="nome">' + (d.nome ? esc(d.nome) : '<span class="falta">sem nome</span>') + '</div>' +
        '<div class="prog"><div class="prog-barra"><i style="width:' + pct + '%"></i></div>' +
          '<div class="prog-txt"><span>' + txt + '</span> ' + (temTotal ? '<span>' + pct + '%</span>' : '') + '</div></div>' +
        '<p class="resumo-obs">' + (d.observacoes ? esc(d.observacoes) : '<span class="falta">Sem observações</span>') + '</p>' +
        '<div class="rodape-cartao"><span' + (pr.feitos < pr.total ? ' class="faltam"' : '') + '>' + pr.feitos + ' de ' + pr.total + ' campos preenchidos</span> ' +
          '<span class="mais">Ver detalhes ›</span></div>' +
        '</article>';
    }

    /* Detalhe: todos os campos. Vazio aparece como "—" apagado, de propósito:
     * o que falta preencher precisa ficar visível, não sumir. A linha de cima
     * de cada etapa fica verde quando a etapa tem valor maior que zero. */
    function detalheHtml(d) {
      var etapas = ETAPAS.map(function (e) {
        var v = d[e.chave];
        return '<div class="etapa' + (typeof v === 'number' && v > 0 ? ' feita' : '') + '">' +
          '<span class="rot">' + e.rotulo + ' ' + e.pct + '</span> <strong>' + (v === null ? '—' : fmtNum(v)) + '</strong></div>';
      }).join('');
      var datas = DATAS.map(function (x) {
        var v = d[x.chave];
        return '<div><span class="rot">' + x.rotulo + '</span> <span' + (v ? '' : ' class="falta"') + '>' + (v ? fmtData(v) : '—') + '</span></div>';
      }).join('');
      var editar = estado.editor
        ? '<a class="link-topo destaque" id="editarDemanda" href="/demandas/editar?mes=' + esc(d.mes) + '&amp;demanda=' + esc(d.id) + '">Editar esta demanda</a>' : '';
      return '<article class="detalhe-dem" role="dialog" aria-modal="true" aria-label="Detalhe da demanda" data-id="' + d.id + '">' +
        '<div class="topo">' + cabecaDemanda(d) + seloPf(d) +
          '<button type="button" class="fechar" id="fecharDetalhe" aria-label="Fechar">×</button></div>' +
        '<div class="nome">' + (d.nome ? esc(d.nome) : '<span class="falta">sem nome</span>') + '</div>' +
        '<div class="mes-det">' + esc(rotuloMes(d.mes)) + '</div>' +
        '<div class="etapas">' + etapas + '</div>' +
        '<div class="datas">' + datas + '</div>' +
        '<div class="obs"><span class="rot">Observações</span> <p>' + (d.observacoes ? esc(d.observacoes) : '<span class="falta">—</span>') + '</p></div>' +
        '<div class="rodape-det"><span>' + esc(quemQuando(d)) + '</span> ' + editar + '</div>' +
        '</article>';
    }

    var ultimoFoco = null;
    function abrirDetalhe(id, foco) {
      estado.aberta = String(id);
      ultimoFoco = foco || null;
      guardarNaUrl('demanda', estado.aberta);
      mostrarDetalhe();
    }
    function fecharDetalhe() {
      estado.aberta = null;
      guardarNaUrl('demanda', '');
      mostrarDetalhe();
      if (ultimoFoco && document.body.contains(ultimoFoco)) ultimoFoco.focus();
      ultimoFoco = null;
    }
    function mostrarDetalhe() {
      var antigo = document.getElementById('fundoDetalhe');
      if (antigo) antigo.parentNode.removeChild(antigo);
      var d = estado.aberta && estado.demandas.filter(function (x) { return String(x.id) === estado.aberta; })[0];
      if (!d) { estado.aberta = null; return; }
      var fundo = document.createElement('div');
      fundo.className = 'fundo-detalhe';
      fundo.id = 'fundoDetalhe';
      fundo.innerHTML = detalheHtml(d);
      document.body.appendChild(fundo);
      document.getElementById('fecharDetalhe').focus();
    }

    function blocoMes(resumoMes) {
      var linhas = estado.demandas.filter(function (d) { return d.mes === resumoMes.mes; });
      var titulo = '<h3 class="sub">' + esc(rotuloMes(resumoMes.mes)) + ' <small>' + linhas.length +
        (linhas.length === 1 ? ' demanda' : ' demandas') + '</small></h3>';
      if (estado.vista === 'cartoes') {
        return titulo + '<div class="cartoes">' + linhas.map(cartaoHtml).join('') + '</div>';
      }
      // zero no rodapé do detalhe é "nada preenchido", igual ao "—" da edição
      var totais = {};
      COLUNAS_SOMA.forEach(function (k) { totais[k] = resumoMes[k] || null; });
      return titulo +
        '<div class="tabela-scroll"><table class="grade ampla">' + cabecalho(false, true) + '<tbody>' +
        linhas.map(function (d) { return linhaHtml(d, false); }).join('') + '</tbody>' +
        rodapeTotais(totais, false) + '</table></div>';
    }

    /* ---- Ano ----
     * O filtro de ano separa os meses por ano e dá o consolidado do ano
     * inteiro a um clique (ano + "Todos os meses"). "Todos os anos" junta
     * tudo, com o ano escrito em cada mês. */
    function anosComRegistro() {
      var vistos = {};
      estado.disponiveis.forEach(function (m) { vistos[m.slice(0, 4)] = true; });
      return Object.keys(vistos).sort();
    }
    function mesesVisiveis() {
      return estado.ano === 'todos' ? estado.disponiveis
        : estado.disponiveis.filter(function (m) { return m.slice(0, 4) === estado.ano; });
    }
    function anoDaSelecao(meses) {
      var anos = meses.map(function (m) { return m.slice(0, 4); })
        .filter(function (a, i, todos) { return todos.indexOf(a) === i; });
      return anos.length === 1 ? anos[0] : 'todos';
    }
    function escolherAno(ano) {
      estado.ano = ano;
      var visiveis = mesesVisiveis();
      var manter = estado.selecionados.filter(function (m) { return visiveis.indexOf(m) >= 0; });
      // trocou para um ano em que nada estava marcado: abre no mês mais recente dele
      selecionar(manter.length ? manter : [visiveis[visiveis.length - 1]]);
    }

    function renderFiltrosVer() {
      var seletorAno = '<label for="selAno">Ano</label><select id="selAno" class="sel-ano">' +
        anosComRegistro().concat(['todos']).map(function (a) {
          return '<option value="' + a + '"' + (a === estado.ano ? ' selected' : '') + '>' +
            (a === 'todos' ? 'Todos os anos' : a) + '</option>';
        }).join('') + '</select>';
      var h = '<div class="chips" role="group" aria-label="Meses">' +
        mesesVisiveis().map(function (m) {
          var marcado = estado.selecionados.indexOf(m) >= 0;
          return '<button type="button" class="chip" data-mes="' + m + '" aria-pressed="' + marcado + '">' + esc(rotuloCurto(m)) + '</button>';
        }).join('') +
        '<button type="button" class="chip todos" data-todos="1">Todos os meses</button></div>';
      // Duas vistas do mesmo dado: cartões (padrão) e tabela. Trocar não busca nada.
      var vista = '<div class="chips vista" role="group" aria-label="Vista"><label>Vista</label>' +
        ['cartoes', 'tabela'].map(function (v) {
          return '<button type="button" class="chip" data-vista="' + v + '" aria-pressed="' + (estado.vista === v) + '">' +
            (v === 'cartoes' ? 'Cartões' : 'Tabela') + '</button>';
        }).join('') + '</div>';
      var barra = document.getElementById('barra');
      barra.innerHTML = seletorAno + '<label>Meses</label>' + h + vista;
    }

    function renderVer() {
      renderFiltrosVer();
      if (!estado.selecionados.length) {
        area.innerHTML = '<div class="vazio">Selecione ao menos um mês acima.</div>';
        return;
      }
      var h = blocoResumo();
      estado.resumo.porMes.forEach(function (m) { h += blocoMes(m); });
      area.innerHTML = h;
      mostrarDetalhe();
      var link = document.getElementById('linkEditar');
      if (link) link.href = '/demandas/editar?mes=' + estado.selecionados[estado.selecionados.length - 1];
    }

    function buscarSelecionados() {
      var pedido = estado.selecionados.slice();
      carregarMeses(pedido).then(function (res) {
        if (estado.selecionados.join(',') !== pedido.join(',')) return; // a seleção mudou no meio do caminho
        if (!res.ok) return falhaAoCarregar(res.j.erro);
        estado.demandas = res.j.demandas;
        estado.resumo = res.j.resumo;
        estado.disponiveis = res.j.mesesDisponiveis;
        renderVer();
      }).catch(function () { falhaAoCarregar(); });
    }

    function selecionar(meses) {
      estado.selecionados = meses.slice().sort();
      guardarNaUrl('meses', estado.selecionados.join(','));
      if (!estado.selecionados.length) { estado.demandas = []; estado.resumo = null; renderVer(); return; }
      buscarSelecionados();
    }

    function configurarDetalhe() {
      area.addEventListener('click', function (e) {
        if (e.target.closest('a')) return; // o link do Jira abre o Jira, não o detalhe
        var c = e.target.closest('.cartao-dem');
        if (c) abrirDetalhe(c.getAttribute('data-id'), c);
      });
      area.addEventListener('keydown', function (e) {
        var c = e.target.closest && e.target.closest('.cartao-dem');
        if (c && e.target === c && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          abrirDetalhe(c.getAttribute('data-id'), c);
        }
      });
      document.addEventListener('click', function (e) {
        if (e.target.id === 'fecharDetalhe' || e.target.id === 'fundoDetalhe') fecharDetalhe();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && estado.aberta) fecharDetalhe();
      });
    }

    function configurarVer() {
      configurarDetalhe();
      document.getElementById('ajuda').textContent = 'Escolha o ano e um ou mais meses. Com um mês você vê o resumo e o ' +
        'detalhe; com vários, o consolidado aparece junto. "Todos os meses" soma o ano escolhido inteiro.';
      document.getElementById('barra').addEventListener('change', function (e) {
        if (e.target.id === 'selAno') escolherAno(e.target.value);
      });
      document.getElementById('barra').addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        var vista = chip.getAttribute('data-vista');
        if (vista) {
          estado.vista = vista === 'tabela' ? 'tabela' : 'cartoes';
          guardarNaUrl('vista', estado.vista === 'tabela' ? 'tabela' : '');
          return renderVer();
        }
        if (chip.getAttribute('data-todos')) return selecionar(mesesVisiveis());
        var mes = chip.getAttribute('data-mes');
        var atuais = estado.selecionados.slice();
        var i = atuais.indexOf(mes);
        if (i >= 0) atuais.splice(i, 1); else atuais.push(mes);
        selecionar(atuais);
      });
    }

    function iniciarVisualizacao() {
      var param = parametro('meses');
      var pedidos = param ? param.split(',').filter(function (m, i, todos) {
        return mesValido(m) && todos.indexOf(m) === i;
      }) : [];
      var inicial = pedidos.length ? pedidos : [mesAtual()];
      carregarMeses(inicial).then(function (res) {
        if (!res.ok) return falhaAoCarregar(res.j.erro);
        estado.editor = !!res.j.editor;
        estado.disponiveis = res.j.mesesDisponiveis;
        configurarVer();

        if (estado.editor) {
          var ed = document.createElement('a');
          ed.className = 'link-topo destaque';
          ed.id = 'linkEditar';
          ed.href = '/demandas/editar';
          ed.textContent = 'Editar';
          document.getElementById('acoesCartao').appendChild(ed);
        }

        if (!estado.disponiveis.length) {
          document.getElementById('barra').innerHTML = '';
          area.innerHTML = '<div class="vazio">Nenhuma demanda cadastrada ainda.</div>';
          return;
        }
        // Só vale mês que tem registro; sem nenhum válido, abre no mais recente.
        var validos = inicial.filter(function (m) { return estado.disponiveis.indexOf(m) >= 0; });
        if (!validos.length) validos = [estado.disponiveis[estado.disponiveis.length - 1]];
        estado.ano = anoDaSelecao(validos);
        if (validos.join(',') === inicial.slice().sort().join(',')) {
          estado.selecionados = validos.slice().sort();
          estado.demandas = res.j.demandas;
          estado.resumo = res.j.resumo;
          guardarNaUrl('meses', estado.selecionados.join(','));
          renderVer();
        } else {
          selecionar(validos);
        }
      }).catch(function () { falhaAoCarregar(); });
    }

    fetch('/api/eu').then(function (r) { return r.ok ? r.json() : null; }).then(function (eu) {
      if (eu && eu.email) document.getElementById('quem').textContent = eu.email;
    }).catch(function () {});

    if (EDITANDO) iniciarEdicao(); else iniciarVisualizacao();
  })();
</script>
