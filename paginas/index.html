<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kanban BRB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700;900&display=swap');

  /* Paleta extraida do site oficial (evertecinc.com): brand-primary-main,
     Brand-Secondary-Verde-verde-main, e os neutros de fundo/texto do tema. */
  :root {
    --bg: #F5F5F5;
    --bg-panel: #FFFFFF;
    --ink: #1E212C;
    --ink-dim: #4B5A68;
    --ink-faint: #7C8894;
    --line: #E5E6E7;
    --line-soft: #EFEFEF;
    --accent: #FF6C0C;
    --accent-soft: #FFE8D9;
    --warn: #A8452E;
    --warn-soft: #F6E9E5;

    --c-andamento: #FF6C0C;  --c-andamento-soft: #FFE8D9;
    --c-dev:       #3A7CA5;  --c-dev-soft:       #E4EEF3;
    --c-teste:     #0DD3AD;  --c-teste-soft:     #E4FFFB;
    --c-terceiros: #A8452E;  --c-terceiros-soft: #F6E9E5;
    --c-concluido: #4B5A68;  --c-concluido-soft: #EAEDEC;

    --shadow: 0 1px 2px rgba(30,33,44,0.06), 0 1px 1px rgba(30,33,44,0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E212C;
      --bg-panel: #262B38;
      --ink: #F5F5F5;
      --ink-dim: #A7B0BC;
      --ink-faint: #78838F;
      --line: #333846;
      --line-soft: #2A2E3A;
      --accent: #FF8A3D;
      --accent-soft: #3A2A1C;
      --warn: #E2725B;
      --warn-soft: #3A241C;

      --c-andamento: #FF8A3D;  --c-andamento-soft: #3A2A1C;
      --c-dev:       #6FA8C9;  --c-dev-soft:       #1E2E38;
      --c-teste:     #3EE8C4;  --c-teste-soft:     #123832;
      --c-terceiros: #E2725B;  --c-terceiros-soft: #3A241C;
      --c-concluido: #A7B0BC;  --c-concluido-soft: #2A2E3A;

      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Lato, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header.top {
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 22px 28px 18px;
  }

  .top-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    max-width: 1400px;
    margin: 0 auto;
  }

  .titles h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .titles p { margin: 0; color: var(--ink-dim); font-size: 0.875rem; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 2px;
    padding: 2px 9px 2px 7px;
    border-radius: 100px;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.72rem;
    font-weight: 600;
    vertical-align: middle;
  }

  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .controls { display: flex; align-items: center; gap: 10px; }

  .search { position: relative; }

  .search input {
    width: 240px;
    padding: 8px 12px 8px 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    color: var(--ink);
    font-size: 0.875rem;
    outline: none;
  }

  .search input:focus { border-color: var(--accent); }
  .search input::placeholder { color: var(--ink-faint); }

  .search svg {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    stroke: var(--ink-faint); fill: none; stroke-width: 2;
    pointer-events: none;
  }

  .search-count {
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-family: ui-monospace, Consolas, monospace;
    min-width: 64px;
  }

  .btn-refresh {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }

  .btn-refresh:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-refresh:disabled { opacity: 0.55; cursor: default; }

  .btn-refresh svg {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none; stroke-width: 2;
  }

  .usuario {
    display: flex; align-items: center; gap: 8px;
    padding-right: 8px; margin-right: 2px;
    border-right: 1px solid var(--line);
  }

  .usuario img {
    width: 26px; height: 26px; border-radius: 50%; display: block;
  }

  .usuario .nome { font-size: 0.8rem; color: var(--ink-dim); }

  .usuario .sair {
    font-size: 0.76rem;
    color: var(--ink-faint);
    background: none; border: none; cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
    padding: 0;
  }

  .usuario .sair:hover { color: var(--warn); }

  .link-portal {
    display: none;
    align-items: center;
    gap: 5px;
    padding-right: 10px;
    margin-right: 2px;
    border-right: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 0.8rem;
    text-decoration: none;
  }
  .link-portal:hover { color: var(--accent); }

  /* Peso proprio, nao o apagado do .link-portal: aquele foi pensado para um
   * link secundario e opcional (so aparece com HUB_URL configurada); o
   * Dashboard e recurso de verdade e sempre visivel, merece se destacar. */
  .link-dashboard {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    margin-right: 6px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .link-dashboard:hover { opacity: 0.8; }
  .link-dashboard svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
  .link-portal svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

  .btn-refresh.girando svg { animation: girar 0.8s linear infinite; }

  @keyframes girar { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .btn-refresh.girando svg { animation: none; }
  }

  .aviso {
    max-width: 1400px;
    margin: 16px auto 0;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--warn-soft);
    border: 1px solid var(--warn);
    color: var(--warn);
    font-size: 0.82rem;
  }

  main { max-width: 1400px; margin: 0 auto; padding: 22px 28px 40px; }

  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(180px, 1fr);
    gap: 16px;
    align-items: start;
  }

  .column {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-self: start;
  }

  .column-head {
    padding: 14px 14px 12px;
    border-bottom: 1px solid var(--line-soft);
    border-top: 3px solid var(--col);
    flex-shrink: 0;
  }

  .column-head .name {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }

  /* Ícone por coluna, na cor da própria coluna. O rótulo é monoespaçado e
   * todo em caixa alta, então cinco cabeçalhos empilhados viram cinco blocos
   * de texto de mesma forma - o ícone é o que dá para reconhecer de longe,
   * antes de ler. */
  .column-head .titulo { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .column-head .acoes { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .column-head .icone svg {
    width: 15px; height: 15px; display: block; color: var(--col);
    stroke: currentColor; fill: none; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* Recolher: existe só na coluna de concluídos. É a única que cresce sem
   * limite (25 itens contra 1 ou 2 das outras) e a única que ninguém precisa
   * ver para tocar o dia - as demais são trabalho em aberto, esconder seria
   * esconder o que importa. */
  .column-head .colapsar {
    background: none; border: none; padding: 0; cursor: pointer;
    color: var(--ink-faint); font-family: inherit; display: flex; align-items: center;
  }
  .column-head .colapsar:hover { color: var(--col); }
  .column-head .colapsar svg {
    width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s ease;
  }
  .column.recolhida .cards { display: none; }
  .column.recolhida .colapsar svg { transform: rotate(180deg); }

  .column-head .label {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--col);
  }

  .column-head .count {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-faint);
    background: var(--col-soft);
    padding: 1px 7px;
    border-radius: 100px;
    font-variant-numeric: tabular-nums;
  }

  .cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .card {
    padding: 10px 12px 11px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--line-soft);
    color: var(--ink);
    transition: border-color 0.12s ease;
  }

  .card:hover { border-color: var(--col); }
  .card.hidden { display: none; }

  .card-title { font-size: 0.85rem; line-height: 1.4; }

  .card-meta {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 6px; margin-top: 9px;
  }

  .assignee-name { font-size: 0.72rem; color: var(--ink-dim); }
  .assignee-name.empty { color: var(--ink-faint); font-style: italic; }

  .avatar {
    position: relative;
    width: 22px; height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .avatar-fallback {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    font-size: 0.62rem; font-weight: 700; color: #fff;
  }

  .avatar-empty { border: 1.5px dashed var(--line); }

  .card-chave {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.66rem; font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .card-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

  .card-progresso {
    flex-shrink: 0;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.66rem; font-weight: 600;
    color: var(--col); background: var(--col-soft);
    padding: 1px 7px; border-radius: 100px;
    font-variant-numeric: tabular-nums;
  }

  .card-barra {
    height: 3px; margin-top: 9px;
    border-radius: 2px; background: var(--line-soft); overflow: hidden;
  }
  .card-barra i { display: block; height: 100%; background: var(--col); }

  .card.tem-detalhe { cursor: default; }

  /* Painel de detalhe do épico. Fica no <body> e posicionado por JS: dentro
   * da coluna ele seria cortado pelo overflow do board. */
  .popover {
    position: fixed; z-index: 60;
    max-width: 520px; width: max-content;
    background: var(--bg-panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(30,33,44,0.18), 0 2px 6px rgba(30,33,44,0.10);
    padding: 12px 14px; display: none;
    max-height: 70vh; overflow-y: auto;
  }
  .popover.on { display: block; }
  .popover h4 {
    font-size: 0.7rem; font-weight: 600; color: var(--ink-dim);
    margin-bottom: 9px; letter-spacing: 0.03em;
  }
  .popover ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }
  .popover li { display: flex; gap: 8px; align-items: flex-start; font-size: 0.78rem; line-height: 1.4; }
  .popover li.sub { padding-left: 16px; font-size: 0.74rem; }
  .popover .marca { flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; }

  /* Chave e status em cima, título embaixo ocupando a linha inteira. Com os
   * três lado a lado, o título ficava espremido entre dois blocos de largura
   * fixa e quebrava em quatro linhas. */
  .popover .corpo { flex: 1; min-width: 0; }
  .popover .meta {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; margin-bottom: 2px;
  }
  .popover .chave {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.68rem; color: var(--ink-faint);
  }
  .popover .txt { display: block; }
  .popover .quem { color: var(--ink-faint); font-size: 0.72rem; }
  /* A cor vem inline, da coluna da tarefa - a mesma da bolinha, do cabeçalho
   * da coluna e da barra de progresso. Antes o status era cinza igual à
   * chave, e os dois na mesma linha viravam um bloco só. */
  .popover .onde {
    flex-shrink: 0; font-size: 0.62rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
  }
  .popover li.feito .txt { color: var(--ink-faint); text-decoration: line-through; }

  .empty-col, .no-match {
    padding: 26px 14px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.8rem;
  }

  /* Uma coluna vazia com só uma frase cinza no meio parecia coluna que não
   * carregou. O ícone diz "está vazia mesmo" sem precisar de mais texto. */
  .empty-col svg {
    width: 34px; height: 34px; display: block; margin: 0 auto 10px;
    stroke: currentColor; fill: none; stroke-width: 1.3;
    stroke-linecap: round; stroke-linejoin: round; opacity: 0.55;
  }

  .no-match { display: none; }

  footer {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 28px 28px;
    color: var(--ink-faint);
    font-size: 0.78rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  @media (max-width: 1080px) {
    .board { grid-auto-flow: row; grid-auto-columns: unset; }
    .search input { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="titles">
      <h1>Kanban BRB <span class="badge" id="badgeSprint"><span class="dot"></span></span></h1>
      <p id="subtitulo">Equipe Exclusiva — Tarefas Dimensa</p>
    </div>
    <div class="controls">
      <a class="link-dashboard" href="/dashboard" title="Métricas e andamento do sprint">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"></path></svg>
        Dashboard
      </a>
      <a class="link-dashboard" href="/demandas" title="Demandas, pontos de função e o que cada etapa já entregou">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
        Demandas
      </a>
      <a class="link-dashboard" href="/admin" id="linkAdmin" style="display:none" title="Usuários e histórico de acessos">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"></path><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3.4a2 2 0 110-4H3.5a1.65 1.65 0 001-1.51 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 5a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0015 5a1.65 1.65 0 001.82.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019 9a1.65 1.65 0 001.51 1H20.6a2 2 0 110 4h-.09A1.65 1.65 0 0019 15z"></path></svg>
        Admin
      </a>
      <a class="link-portal" id="linkPortal" href="#">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        Portal
      </a>
      <div class="usuario" id="usuario" style="display:none">
        <span class="nome" id="usuarioNome"></span>
        <button class="sair" id="btnSair" type="button">Sair</button>
      </div>
      <button class="btn-refresh" id="btnAtualizar" type="button">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        <span id="btnAtualizarTexto">Atualizar agora</span>
      </button>
      <div class="search-count" id="searchCount"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="filtro" placeholder="Filtrar tarefas..." autocomplete="off">
      </div>
    </div>
  </div>
  <div class="aviso" id="aviso" style="display:none"></div>
</header>

<main><div class="board" id="board"></div></main>

<footer>
  <span id="rodapeEsq"></span>
  <span id="rodapeDir"></span>
</footer>

<script>
  var dados = { vazio: true, colunas: [], pessoas: {} };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Ícones como literais fechados, escolhidos por chave — nada que venha da
   * API vira markup. A chave é col.cor, que o servidor já usa para escolher
   * a variável de cor da coluna. */
  var ICONES_COLUNA = {
    andamento: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"></path>' +
      '<path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>',
    dev: '<svg viewBox="0 0 24 24"><path d="M9 17l-5-5 5-5M15 7l5 5-5 5"></path></svg>',
    teste: '<svg viewBox="0 0 24 24"><path d="M9.5 3v6.2L4.8 17.4A2 2 0 0 0 6.5 20.5h11a2 2 0 0 0 1.7-3.1L14.5 9.2V3"></path>' +
      '<path d="M8 3h8M7.4 14h9.2"></path></svg>',
    terceiros: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle>' +
      '<path d="M3.5 20c0-3 2.5-4.7 5.5-4.7s5.5 1.7 5.5 4.7"></path>' +
      '<path d="M16.5 5.5a3 3 0 0 1 0 5.6M18 20c0-2.2-.8-3.7-2-4.6"></path></svg>',
    concluido: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle>' +
      '<path d="M8.2 12.3l2.6 2.6 5-5.2"></path></svg>'
  };

  var ICONE_VAZIO = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M3 13h4l1.4 2.5h7.2L17 13h4"></path>' +
    '<path d="M4.6 6.6L3 13v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5l-1.6-6.4A2 2 0 0 0 17.5 5h-11a2 2 0 0 0-1.9 1.6z"></path></svg>';

  var ICONE_CHEVRON = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M6 15l6-6 6 6"></path></svg>';

  function iniciais(nome) {
    var p = nome.trim().split(/\s+/);
    return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }

  function matiz(nome) {
    var h = 0;
    for (var i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) % 360;
    return h;
  }

  function formatarData(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  /* Chave fechada, igual ao ICONES_COLUNA: col.cor vem do servidor, mas só
   * serve de índice num mapa conhecido - nunca entra no CSS como texto livre. */
  var CORES_OK = { andamento: 1, dev: 1, teste: 1, terceiros: 1, concluido: 1 };

  function corDaColuna(nome) {
    for (var i = 0; i < (dados.colunas || []).length; i++) {
      if (dados.colunas[i].nome === nome) {
        return CORES_OK[dados.colunas[i].cor] ? dados.colunas[i].cor : 'concluido';
      }
    }
    return 'concluido';
  }

  function montarCard(card, iCol, iCard) {
    var tarefas = card.tarefas || [];

    /* Chave do Jira (JDCBEPIC-192 / JDCBBRB-259). O nome já traz o número da
     * demanda; a chave é o que serve para achar o item no Jira.
     *
     * Card de épico mostra a chave do épico. Card sem épico mostra a chave da
     * própria task - senão a linha apareceria em uns cards e não em outros,
     * sem motivo visível para quem lê. */
    var chave = card.epico ||
      (tarefas.length === 1 && tarefas[0].chave ? tarefas[0].chave : null);

    var html = chave ? '<div class="card-chave">' + esc(chave) + '</div>' : '';

    html += '<div class="card-topo">' +
              '<div class="card-title">' + esc(card.titulo) + '</div>';

    // Progresso só quando o épico tem mais de uma tarefa - em card de uma
    // tarefa só, "0/1" não informa nada.
    if (card.total > 1) {
      html += '<span class="card-progresso">' + card.concluidas + '/' + card.total + '</span>';
    }
    html += '</div>';

    var busca = card.titulo;
    tarefas.forEach(function (t) { busca += ' ' + t.titulo + ' ' + (t.chave || ''); });
    if (card.epico) busca += ' ' + card.epico;

    if (dados.mostrarResponsavel) {
      var p = card.pessoa ? dados.pessoas[card.pessoa] : null;

      // O card mostra só quem está com a demanda agora - quem mais passou pelo
      // épico é assunto do painel de detalhe. A busca, essa, continua achando
      // por qualquer um dos envolvidos.
      tarefas.forEach(function (t) {
        var q = t.pessoa ? dados.pessoas[t.pessoa] : null;
        if (q) busca += ' ' + q.nome;
      });

      if (p) {
        var cor = 'hsl(' + matiz(p.nome) + ', 42%, 40%)';
        html += '<div class="card-meta">' +
                  '<span class="assignee-name">' + esc(p.nome) + '</span>' +
                  '<span class="avatar">' +
                    '<img src="' + esc(p.avatar) + '" alt="" loading="lazy" ' +
                      'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
                    '<span class="avatar-fallback" style="background:' + cor + '">' + iniciais(p.nome) + '</span>' +
                  '</span>' +
                '</div>';
      } else {
        html += '<div class="card-meta">' +
                  '<span class="assignee-name empty">Sem responsável</span>' +
                  '<span class="avatar avatar-empty"></span>' +
                '</div>';
      }
    }

    if (card.total > 1) {
      var pct = Math.round((card.concluidas / card.total) * 100);
      html += '<div class="card-barra"><i style="width:' + pct + '%"></i></div>';
    }

    return '<div class="card' + (tarefas.length ? ' tem-detalhe' : '') + '" ' +
             'data-col="' + iCol + '" data-i="' + iCard + '" ' +
             'data-text="' + esc(busca.toLowerCase()) + '">' + html + '</div>';
  }

  function render(novosDados) {
    if (novosDados) dados = novosDados;
    fecharPopover();

    var board = document.getElementById('board');
    board.innerHTML = '';

    var aviso = document.getElementById('aviso');
    aviso.style.display = 'none';

    if (dados.vazio) {
      aviso.style.display = 'block';
      aviso.textContent = 'Nenhum dado carregado ainda. ' + (dados.erro || '');
      return;
    }

    document.getElementById('badgeSprint').innerHTML =
      '<span class="dot"></span>Sprint ' + esc(dados.sprint);

    if (dados.ultimoErro) {
      aviso.style.display = 'block';
      aviso.textContent = 'A última tentativa de atualização falhou em ' +
        formatarData(dados.erroEm) + '. Os dados abaixo são do último carregamento bem-sucedido. (' +
        dados.ultimoErro + ')';
    }

    var totalCards = 0;

    dados.colunas.forEach(function (col, iCol) {
      totalCards += col.cards.length;

      var sec = document.createElement('section');
      sec.className = 'column';
      sec.style.setProperty('--col', 'var(--c-' + col.cor + ')');
      sec.style.setProperty('--col-soft', 'var(--c-' + col.cor + '-soft)');

      var corpo = col.cards.length
        ? col.cards.map(function (c, i) { return montarCard(c, iCol, i); }).join('')
        : '<div class="empty-col">' + ICONE_VAZIO + 'Nenhum item nesta coluna</div>';

      // col.cor vem do servidor, mas só serve de chave num mapa fechado: um
      // valor inesperado cai no '' e o cabeçalho fica sem ícone, nunca vira
      // markup. Mesmo motivo do esc() no nome da coluna logo abaixo.
      var icone = ICONES_COLUNA[col.cor] || '';
      var podeRecolher = col.cor === 'concluido';

      sec.innerHTML =
        '<div class="column-head"><div class="name">' +
          '<span class="titulo">' +
            (icone ? '<span class="icone">' + icone + '</span>' : '') +
            '<span class="label">' + esc(col.nome) + '</span>' +
          '</span>' +
          '<span class="acoes">' +
            '<span class="count">' + col.cards.length + '</span>' +
            (podeRecolher
              ? '<button type="button" class="colapsar" aria-expanded="true" ' +
                'title="Recolher coluna">' + ICONE_CHEVRON + '</button>'
              : '') +
          '</span>' +
        '</div></div>' +
        '<div class="cards">' + corpo + '<div class="no-match">Nenhum resultado</div></div>';

      board.appendChild(sec);
    });

    var nEpicos = 0, nTarefas = 0;
    dados.colunas.forEach(function (col) {
      col.cards.forEach(function (card) {
        if (card.epico) nEpicos++;
        nTarefas += (card.tarefas ? card.tarefas.length : 1);
      });
    });

    document.getElementById('rodapeEsq').textContent = nEpicos
      ? nEpicos + ' épicos · ' + totalCards + ' cards · ' + nTarefas + ' tarefas'
      : totalCards + ' tarefas · ' + dados.colunas.length + ' colunas';
    document.getElementById('rodapeDir').textContent =
      'Atualizado em ' + formatarData(dados.atualizadoEm);
  }

  function carregarDados() {
    return fetch('/api/dados', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function pedirAtualizacao() {
    return fetch('/api/atualizar', { method: 'POST' }).then(function (r) {
      return r.json().then(function (corpo) {
        if (!r.ok) {
          var e = new Error(corpo.erro || ('HTTP ' + r.status));
          e.requestId = corpo.requestId;
          throw e;
        }
        return corpo;
      });
    });
  }

  carregarDados()
    .then(function (novosDados) { render(novosDados); })
    .catch(function (erro) {
      render({ vazio: true, erro: String(erro && erro.message || erro), colunas: [], pessoas: {} });
    });

  fetch('/api/eu').then(function (r) { return r.ok ? r.json() : null; }).then(function (eu) {
    if (!eu) return;
    document.getElementById('usuarioNome').textContent = eu.email;
    document.getElementById('usuario').style.display = 'flex';
    if (eu.hubUrl) {
      var link = document.getElementById('linkPortal');
      link.href = eu.hubUrl;
      link.style.display = 'flex';
    }
    if (eu.admin) document.getElementById('linkAdmin').style.display = 'flex';
  });

  document.getElementById('btnSair').addEventListener('click', function () {
    fetch('/auth/logout', { method: 'POST' }).then(function () {
      window.location.href = '/login.html';
    });
  });

  var btnAtualizar = document.getElementById('btnAtualizar');
  var btnAtualizarTexto = document.getElementById('btnAtualizarTexto');

  btnAtualizar.addEventListener('click', function () {
    btnAtualizar.disabled = true;
    btnAtualizar.classList.add('girando');
    btnAtualizarTexto.textContent = 'Atualizando...';

    pedirAtualizacao()
      .then(function (novosDados) {
        render(novosDados);
        aplicarFiltro();
      })
      .catch(function (erro) {
        var av = document.getElementById('aviso');
        av.style.display = 'block';
        // O servidor devolve mensagem generica + requestId. O requestId e
        // mostrado para a pessoa conseguir reportar o problema; o motivo
        // real fica so no log do servidor.
        av.textContent = 'Não foi possível atualizar agora. Os dados abaixo são do último carregamento.' +
          (erro && erro.requestId ? ' (código ' + erro.requestId.slice(0, 8) + ')' : '');
      })
      .finally(function () {
        btnAtualizar.disabled = false;
        btnAtualizar.classList.remove('girando');
        btnAtualizarTexto.textContent = 'Atualizar agora';
      });
  });

  var filtro = document.getElementById('filtro');
  var contador = document.getElementById('searchCount');

  function aplicarFiltro() {
    var q = filtro.value.trim().toLowerCase();
    var visiveis = 0, total = 0;

    document.querySelectorAll('.cards').forEach(function (colEl) {
      var cards = colEl.querySelectorAll('.card');
      var naColuna = 0;
      cards.forEach(function (card) {
        total++;
        var bate = !q || card.getAttribute('data-text').indexOf(q) !== -1;
        card.classList.toggle('hidden', !bate);
        if (bate) { naColuna++; visiveis++; }
      });
      var nm = colEl.querySelector('.no-match');
      if (nm) nm.style.display = (q && naColuna === 0 && cards.length > 0) ? 'block' : 'none';
    });

    contador.textContent = q ? visiveis + ' de ' + total : '';
  }

  filtro.addEventListener('input', aplicarFiltro);

  /* ---- detalhe do épico ----
   * O card mostra o épico; o que o time está tocando de fato vive aqui.
   * Hover no desktop e clique também: em toque não existe hover, e sem o
   * clique o detalhe ficaria inacessível no celular. */
  var popover = document.createElement('div');
  popover.className = 'popover';
  popover.setAttribute('role', 'tooltip');
  document.body.appendChild(popover);

  var cardAberto = null;

  function cardDe(el) {
    var col = dados.colunas && dados.colunas[Number(el.getAttribute('data-col'))];
    return col ? col.cards[Number(el.getAttribute('data-i'))] : null;
  }

  /* O nome da coluna agrupa vários itens ("Itens concluídos"); como status de
   * UMA tarefa, o plural fica errado. */
  var ROTULO_STATUS = { 'Itens concluídos': 'Concluído' };

  function conteudoPopover(card) {
    // Tarefas de verdade primeiro, subtarefas depois: a ordem do Jira mistura
    // as duas e o que interessa a quem lê é a tarefa, não a etapa interna.
    var tarefas = (card.tarefas || []).slice().sort(function (a, b) {
      return (a.subtarefa ? 1 : 0) - (b.subtarefa ? 1 : 0);
    });

    var titulo = card.epico ? esc(card.epico) : 'Item sem épico';
    if (card.total > 1) titulo += ' · ' + card.concluidas + ' de ' + card.total + ' concluídas';

    var h = '<h4>' + titulo + '</h4><ul>';
    tarefas.forEach(function (t) {
      var p = t.pessoa ? dados.pessoas[t.pessoa] : null;
      var cor = corDaColuna(t.coluna);
      h += '<li class="' + (t.subtarefa ? 'sub' : '') + (t.concluida ? ' feito' : '') + '">' +
             '<span class="marca" style="background:var(--c-' + cor + ')"></span>' +
             '<div class="corpo">' +
               '<div class="meta">' +
                 '<span class="chave">' + esc(t.chave || '') + '</span>' +
                 '<span class="onde" style="color:var(--c-' + cor + ')">' +
                   esc(ROTULO_STATUS[t.coluna] || t.coluna) + '</span>' +
               '</div>' +
               '<span class="txt">' + esc(t.titulo) +
                 (p ? ' <span class="quem">· ' + esc(p.nome) + '</span>' : '') +
               '</span>' +
             '</div>' +
           '</li>';
    });
    return h + '</ul>';
  }

  function abrirPopover(el) {
    var card = cardDe(el);
    if (!card || !card.tarefas || !card.tarefas.length) return;

    popover.innerHTML = conteudoPopover(card);
    popover.style.visibility = 'hidden';
    popover.classList.add('on');

    // Mede depois de renderizar para caber na tela: ao lado do card quando dá,
    // do outro lado quando não dá, e sempre dentro da janela.
    var r = el.getBoundingClientRect();
    var pr = popover.getBoundingClientRect();

    var esq = r.right + 10;
    if (esq + pr.width > window.innerWidth - 8) esq = r.left - pr.width - 10;
    if (esq < 8) esq = 8;

    var topo = r.top;
    if (topo + pr.height > window.innerHeight - 8) topo = window.innerHeight - pr.height - 8;
    if (topo < 8) topo = 8;

    popover.style.left = esq + 'px';
    popover.style.top = topo + 'px';
    popover.style.visibility = '';
    cardAberto = el;
  }

  function fecharPopover() {
    cancelarTimers();
    popover.classList.remove('on');
    cardAberto = null;
  }

  /* O painel abre ao lado do card, então levar o mouse até ele obriga a passar
   * por cima de outros cards. Sem intenção de hover, cada card no caminho
   * roubava o painel e trocava o conteúdo no meio da leitura.
   *
   * Por isso: trocar de épico exige PARAR sobre o outro card; sair do card dá
   * um tempo antes de fechar, e entrar no painel cancela o fechamento. Passar
   * por cima de raspão não muda nada. */
  var ESPERA_TROCA_MS = 240;   // parada mínima sobre outro card para ele assumir
  var ESPERA_SAIDA_MS = 280;   // folga para o mouse atravessar até o painel
  var ESPERA_1A_MS = 60;       // sem painel aberto, responde quase na hora

  var timerAbrir = null;
  var timerFechar = null;

  function cancelarTimers() {
    if (timerAbrir) { clearTimeout(timerAbrir); timerAbrir = null; }
    if (timerFechar) { clearTimeout(timerFechar); timerFechar = null; }
  }

  function agendarAbertura(el) {
    if (timerFechar) { clearTimeout(timerFechar); timerFechar = null; }
    if (el === cardAberto) return;
    if (timerAbrir) clearTimeout(timerAbrir);
    timerAbrir = setTimeout(function () {
      timerAbrir = null;
      abrirPopover(el);
    }, cardAberto ? ESPERA_TROCA_MS : ESPERA_1A_MS);
  }

  function agendarFechamento() {
    if (timerAbrir) { clearTimeout(timerAbrir); timerAbrir = null; }
    if (timerFechar) clearTimeout(timerFechar);
    timerFechar = setTimeout(function () {
      timerFechar = null;
      fecharPopover();
    }, ESPERA_SAIDA_MS);
  }

  var boardEl = document.getElementById('board');

  boardEl.addEventListener('mouseover', function (e) {
    var el = e.target.closest ? e.target.closest('.card') : null;
    if (!el) return;
    agendarAbertura(el);
  });

  boardEl.addEventListener('mouseout', function (e) {
    var el = e.target.closest ? e.target.closest('.card') : null;
    if (!el || (e.relatedTarget && el.contains(e.relatedTarget))) return;
    agendarFechamento();
  });

  // Dentro do painel ele fica: é onde a pessoa está lendo.
  popover.addEventListener('mouseenter', cancelarTimers);
  popover.addEventListener('mouseleave', agendarFechamento);

  // Clique é imediato, sem espera - e serve de acesso no celular, onde
  // hover não existe.
  boardEl.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.card') : null;
    if (!el) return;
    cancelarTimers();
    if (el === cardAberto) fecharPopover(); else abrirPopover(el);
  });

  // Clique fora de card e fora do painel fecha na hora.
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('.popover') || e.target.closest('.card')) return;
    fecharPopover();
  });

  // O painel é posicionado em coordenadas fixas: qualquer rolagem ou resize
  // o deixaria apontando para o lugar errado. Rolagem dentro dele não conta.
  window.addEventListener('scroll', function (e) {
    if (e.target && e.target.closest && e.target.closest('.popover')) return;
    fecharPopover();
  }, true);
  window.addEventListener('resize', fecharPopover);


  /* Delegado no board, não no botão: o render() reconstrói as colunas a cada
   * atualização (manual e a automática de 5 em 5 minutos), então um listener
   * preso ao botão morreria no primeiro refresh. O estado recolhido também
   * não sobrevive ao redesenho — e é o certo aqui: se a coluna mudou de
   * conteúdo, esconder a mudança seria o oposto do que o quadro serve. */
  document.getElementById('board').addEventListener('click', function (e) {
    var botao = e.target.closest ? e.target.closest('.colapsar') : null;
    if (!botao) return;
    var coluna = botao.closest('.column');
    var recolhida = coluna.classList.toggle('recolhida');
    botao.setAttribute('aria-expanded', recolhida ? 'false' : 'true');
    botao.title = recolhida ? 'Expandir coluna' : 'Recolher coluna';
  });

  // Confere o snapshot a cada 5 minutos e redesenha sozinho, sem F5.
  var INTERVALO_AUTO_MS = 5 * 60 * 1000;

  setInterval(function () {
    carregarDados()
      .then(function (novosDados) {
        if (novosDados && novosDados.atualizadoEm !== dados.atualizadoEm) {
          render(novosDados);
          aplicarFiltro();
        }
      })
      .catch(function (erro) {
        console.warn('Falha na atualização automática em segundo plano:', erro);
      });
  }, INTERVALO_AUTO_MS);
</script>
</body>
</html>
