<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar — Kanban</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700;900&display=swap');

  :root {
    --bg: #F5F5F5;
    --bg-panel: #FFFFFF;
    --ink: #1E212C;
    --ink-dim: #4B5A68;
    --ink-faint: #7C8894;
    --line: #E5E6E7;
    --accent: #FF6C0C;
    --accent-soft: #FFE8D9;
    --warn: #A8452E;
    --warn-soft: #F6E9E5;
    --ok: #0DD3AD;
    --ok-soft: #E4FFFB;
    --shadow: 0 1px 2px rgba(30,33,44,0.06), 0 1px 1px rgba(30,33,44,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E212C;
      --bg-panel: #262B38;
      --ink: #F5F5F5;
      --ink-dim: #A7B0BC;
      --ink-faint: #78838F;
      --line: #333846;
      --accent: #FF8A3D;
      --accent-soft: #3A2A1C;
      --warn: #E2725B;
      --warn-soft: #3A241C;
      --ok: #3EE8C4;
      --ok-soft: #123832;
      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: Lato, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: min(360px, 90vw);
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 32px 28px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 6px; text-align: center; }
  p.sub { color: var(--ink-dim); font-size: 0.875rem; margin: 0 0 22px; text-align: center; }

  .abas {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
  }
  .abas button {
    flex: 1;
    padding: 7px 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .abas button.ativa { background: var(--accent); color: #fff; }

  label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-dim);
    margin: 14px 0 5px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.9rem;
    outline: none;
  }
  input:focus { border-color: var(--accent); }

  button.principal {
    width: 100%;
    margin-top: 20px;
    padding: 10px 0;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.principal:disabled { opacity: 0.6; cursor: default; }

  .aviso {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.82rem;
    display: none;
    text-align: left;
  }
  .aviso.erro { background: var(--warn-soft); border: 1px solid var(--warn); color: var(--warn); }
  .aviso.ok { background: var(--ok-soft); border: 1px solid var(--ok); color: var(--ok); }
  .obrig { color: var(--warn); font-weight: 700; margin-left: 2px; }
  .esqueci { margin: 18px 0 0; font-size: 0.76rem; line-height: 1.45; color: var(--ink-faint); text-align: center; }

</style>
</head>
<body>
  <div class="card">
    <h1>Kanban</h1>

    <div class="abas">
      <button type="button" id="abaEntrar" class="ativa">Entrar</button>
      <button type="button" id="abaCadastrar">Cadastrar</button>
    </div>

    <form id="formulario">
      <label for="email">E-mail<span class="obrig">*</span></label>
      <input type="email" id="email" name="username" required autocomplete="username">

      <label for="senha">Senha<span class="obrig">*</span></label>
      <input type="password" id="senha" name="password" required autocomplete="current-password" minlength="8">

      <button class="principal" type="submit" id="botaoPrincipal">Entrar</button>
    </form>

    <div class="aviso" id="aviso"></div>

    <p class="esqueci">Esqueceu a senha? Peça ao administrador do sistema um link para criar uma nova.</p>
  </div>

  <script>
    var modo = 'entrar'; // ou 'cadastrar'

    var abaEntrar = document.getElementById('abaEntrar');
    var abaCadastrar = document.getElementById('abaCadastrar');
    var botaoPrincipal = document.getElementById('botaoPrincipal');
    var campoSenha = document.getElementById('senha');
    var aviso = document.getElementById('aviso');

    function setModo(novoModo) {
      modo = novoModo;
      var ehEntrar = modo === 'entrar';
      abaEntrar.classList.toggle('ativa', ehEntrar);
      abaCadastrar.classList.toggle('ativa', !ehEntrar);
      botaoPrincipal.textContent = ehEntrar ? 'Entrar' : 'Criar conta';
      campoSenha.autocomplete = ehEntrar ? 'current-password' : 'new-password';
      esconderAviso();
    }

    abaEntrar.addEventListener('click', function () { setModo('entrar'); });
    abaCadastrar.addEventListener('click', function () { setModo('cadastrar'); });

    function mostrarAviso(texto, tipo) {
      aviso.textContent = texto;
      aviso.className = 'aviso ' + tipo;
      aviso.style.display = 'block';
    }
    function esconderAviso() {
      aviso.style.display = 'none';
    }

    /* Pede ao navegador para guardar o login. Como a entrada é feita sem
     * recarregar a página (fetch), o Chrome/Edge nem sempre percebem que deu
     * certo e não oferecem salvar a senha. PasswordCredential é o pedido
     * explícito; onde não existe (Firefox, Safari) fica a detecção normal do
     * navegador. Nunca segura a entrada: no máximo 3 s, e erro é ignorado. A
     * senha vai só para o cofre do próprio navegador, nada é gravado aqui. */
    function guardarNoNavegador(email, senha) {
      if (!window.PasswordCredential || !navigator.credentials || !navigator.credentials.store) return Promise.resolve();
      var pedido;
      try {
        pedido = navigator.credentials.store(new window.PasswordCredential({ id: email, password: senha, name: email }));
      } catch (e) { return Promise.resolve(); }
      return Promise.race([
        Promise.resolve(pedido).catch(function () {}),
        new Promise(function (r) { setTimeout(r, 3000); })
      ]);
    }

    document.getElementById('formulario').addEventListener('submit', function (ev) {
      ev.preventDefault();
      esconderAviso();

      var email = document.getElementById('email').value.trim();
      var senha = campoSenha.value;
      var rota = modo === 'entrar' ? '/auth/entrar' : '/auth/cadastro';

      botaoPrincipal.disabled = true;

      fetch(rota, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, senha: senha })
      })
        .then(function (r) {
          return r.json().then(function (corpo) { return { ok: r.ok, corpo: corpo }; });
        })
        .then(function (res) {
          if (!res.ok) {
            mostrarAviso(res.corpo.erro || 'Não foi possível continuar.', 'erro');
            return;
          }
          if (modo === 'entrar') {
            guardarNoNavegador(email, senha).then(function () { window.location.href = '/'; });
          } else {
            setModo('entrar');
            mostrarAviso('Cadastro criado! Enviamos um e-mail para você. Verifique sua caixa de entrada e clique no link de confirmação antes de entrar.', 'ok');
          }
        })
        .catch(function () { mostrarAviso('Falha ao conversar com o servidor.', 'erro'); })
        .finally(function () { botaoPrincipal.disabled = false; });
    });

    // Mensagens vindas do link de confirmacao de e-mail.
    var params = new URLSearchParams(window.location.search);
    if (params.get('confirmado')) {
      mostrarAviso('E-mail confirmado. Agora é só entrar com seu e-mail e senha.', 'ok');
    }
    // Volta do login único (/sso) que não deu certo: passe vencido ou já usado.
    if (params.get('sso') === 'expirado') {
      mostrarAviso('O acesso direto expirou. Entre com seu e-mail e senha (ou volte ao Portal e clique de novo).', 'erro');
    } else if (params.get('sso') === 'sem-acesso') {
      mostrarAviso('Esse e-mail não tem acesso liberado a este board.', 'erro');
    }

    // O Supabase devolve erros no fragmento da URL (#error=...), nao na
    // query string - o caso mais comum e o link de confirmacao expirado.
    if (window.location.hash) {
      var hash = new URLSearchParams(window.location.hash.substring(1));
      if (hash.get('error')) {
        var expirou = hash.get('error_code') === 'otp_expired';
        mostrarAviso(
          expirou
            ? 'Esse link de confirmação expirou. Cadastre-se novamente para receber um link novo.'
            : 'Não foi possível confirmar seu e-mail. Tente se cadastrar novamente.',
          'erro'
        );
        history.replaceState(null, '', window.location.pathname);
      }
    }
  </script>
</body>
</html>
